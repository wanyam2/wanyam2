<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>한국사 시대별 인물 CBT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet" />
  <style>
:root {
  --ink: #14201c;
  --muted: #4a5c55;
  --paper: #f3f7f4;
  --panel: rgba(255, 255, 255, 0.86);
  --line: rgba(20, 32, 28, 0.12);
  --accent: #0f6b4c;
  --accent-2: #c45c26;
  --good: #1b7a4a;
  --bad: #b42318;
  --warn: #9a6700;
  --shadow: 0 18px 50px rgba(15, 40, 30, 0.12);
  --radius: 18px;
  --font-display: "Outfit", "IBM Plex Sans KR", sans-serif;
  --font-body: "IBM Plex Sans KR", sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  font-family: var(--font-body);
  color: var(--ink);
  background: #dfeae3;
  line-height: 1.55;
}

.bg-layer {
  position: fixed;
  inset: 0;
  z-index: -1;
  background:
    radial-gradient(1000px 500px at 10% -10%, rgba(196, 92, 38, 0.18), transparent 55%),
    radial-gradient(900px 480px at 100% 0%, rgba(15, 107, 76, 0.22), transparent 50%),
    linear-gradient(160deg, #e8f1ec 0%, #f7f3ee 45%, #d9e8df 100%);
  animation: drift 18s ease-in-out infinite alternate;
}
.bg-layer::after {
  content: "";
  position: absolute;
  inset: 0;
  opacity: 0.35;
  background-image:
    linear-gradient(rgba(20, 32, 28, 0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(20, 32, 28, 0.03) 1px, transparent 1px);
  background-size: 28px 28px;
  mask-image: radial-gradient(ellipse at center, black 40%, transparent 80%);
}

@keyframes drift {
  from { transform: scale(1) translateY(0); }
  to { transform: scale(1.04) translateY(-8px); }
}

.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 1rem;
  padding: 1rem 1.25rem;
  border-bottom: 1px solid var(--line);
  backdrop-filter: blur(10px);
  background: rgba(255, 255, 255, 0.55);
  position: sticky;
  top: 0;
  z-index: 10;
}

.brand { display: flex; align-items: center; gap: 0.85rem; }
.brand-mark {
  font-family: var(--font-display);
  font-weight: 800;
  letter-spacing: 0.04em;
  background: var(--ink);
  color: #f4faf6;
  width: 3rem;
  height: 3rem;
  border-radius: 12px;
  display: grid;
  place-items: center;
  animation: popIn 0.6s ease both;
}
.brand-text { display: flex; flex-direction: column; }
.brand-text strong {
  font-family: var(--font-display);
  font-size: 1.05rem;
  letter-spacing: -0.02em;
}
.brand-text span { font-size: 0.78rem; color: var(--muted); }

.top-meta { display: flex; align-items: center; gap: 1rem; }
.timer {
  font-family: var(--font-display);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  background: #12241d;
  color: #e8fff4;
  padding: 0.45rem 0.75rem;
  border-radius: 999px;
  min-width: 4.5rem;
  text-align: center;
}
.timer.warn { background: var(--accent-2); }
.timer.danger { background: var(--bad); animation: pulse 1s ease infinite; }

@keyframes pulse {
  50% { transform: scale(1.04); }
}

.progress-wrap { min-width: 8rem; }
.progress-label { font-size: 0.75rem; color: var(--muted); margin-bottom: 0.25rem; }
.progress-track {
  height: 6px;
  background: rgba(20, 32, 28, 0.1);
  border-radius: 999px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, var(--accent), #2a9d6e);
  transition: width 0.35s ease;
}

main {
  max-width: 1100px;
  margin: 0 auto;
  padding: 1.5rem 1rem 3rem;
}

.panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 1.75rem;
  animation: rise 0.55s ease both;
}

@keyframes rise {
  from { opacity: 0; transform: translateY(14px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes popIn {
  from { opacity: 0; transform: scale(0.86); }
  to { opacity: 1; transform: scale(1); }
}

.eyebrow {
  text-transform: uppercase;
  letter-spacing: 0.14em;
  font-size: 0.72rem;
  font-weight: 600;
  color: var(--accent);
  margin: 0 0 0.6rem;
}
h1 {
  font-family: var(--font-display);
  font-weight: 800;
  letter-spacing: -0.03em;
  font-size: clamp(2rem, 5vw, 3.1rem);
  line-height: 1.15;
  margin: 0 0 0.75rem;
}
.lead { color: var(--muted); margin: 0 0 1.5rem; font-size: 1.05rem; }
.hint { color: var(--muted); font-size: 0.9rem; margin: 1rem 0 0; }

.subject-grid {
  list-style: none;
  padding: 0;
  margin: 0 0 1.5rem;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 0.75rem;
}
.subject-grid li {
  padding: 0.9rem 1rem;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: rgba(255, 255, 255, 0.7);
  display: flex;
  flex-direction: column;
  gap: 0.2rem;
  transition: transform 0.25s ease, border-color 0.25s ease;
}
.subject-grid li:hover {
  transform: translateY(-2px);
  border-color: rgba(15, 107, 76, 0.35);
}
.subject-grid b { font-size: 0.95rem; }
.subject-grid span { color: var(--muted); font-size: 0.82rem; }
.subject-grid li.hot {
  border-color: rgba(196, 92, 38, 0.45);
  background: linear-gradient(160deg, rgba(255, 244, 232, 0.95), rgba(255, 255, 255, 0.85));
}
.subject-grid li.hot b { color: var(--accent-2); }

.focus-banner {
  margin: 0 0 1.25rem;
  padding: 0.95rem 1.05rem;
  border-radius: 14px;
  border: 1px solid rgba(196, 92, 38, 0.28);
  background: rgba(255, 248, 242, 0.95);
  color: var(--muted);
  font-size: 0.92rem;
  line-height: 1.5;
}
.focus-banner strong {
  display: block;
  color: var(--accent-2);
  margin-bottom: 0.35rem;
  font-size: 0.95rem;
}
.focus-banner b { color: var(--ink); }

.weakness-box {
  margin: 0 0 1.25rem;
  padding: 1rem 1.1rem;
  border-radius: 14px;
  border: 1px solid rgba(15, 107, 76, 0.2);
  background: rgba(241, 250, 245, 0.95);
}
.weakness-box strong {
  display: block;
  margin-bottom: 0.55rem;
  color: var(--accent);
}
.weak-row {
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem 0.75rem;
  align-items: baseline;
  padding: 0.35rem 0;
  border-bottom: 1px dashed var(--line);
  font-size: 0.92rem;
}
.weak-row:last-of-type { border-bottom: none; }
.weak-row em { color: var(--muted); font-style: normal; }
.weak-tip {
  margin: 0.7rem 0 0;
  color: var(--muted);
  font-size: 0.88rem;
}
.subject-scores article.weak {
  border-color: rgba(196, 92, 38, 0.4);
  background: #fff6ef;
}

.cta-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.85rem;
}

.btn {
  font-family: var(--font-body);
  font-weight: 600;
  border: none;
  cursor: pointer;
  border-radius: 12px;
  padding: 0.75rem 1.15rem;
  font-size: 0.95rem;
  transition: transform 0.15s ease, background 0.2s ease, opacity 0.2s ease;
}
.btn:hover { transform: translateY(-1px); }
.btn:active { transform: translateY(0); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
.btn.primary { background: var(--accent); color: #fff; }
.btn.primary:hover { background: #0c5a40; }
.btn.secondary { background: #1d2f28; color: #f3fff8; }
.btn.ghost {
  background: transparent;
  border: 1px solid var(--line);
  color: var(--ink);
}
.btn.full { width: 100%; }
a.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
}

.era-label {
  margin: 0 0 0.55rem;
  font-weight: 700;
  font-size: 0.95rem;
}
.era-buttons {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 0.55rem;
}
.era-btn {
  border: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.85);
  border-radius: 14px;
  padding: 0.75rem 0.6rem;
  cursor: pointer;
  font-family: var(--font-body);
  display: flex;
  flex-direction: column;
  gap: 0.2rem;
  text-align: left;
  transition: border-color 0.2s ease, transform 0.15s ease, background 0.2s ease;
}
.era-btn b { font-size: 0.9rem; color: var(--ink); }
.era-btn span { font-size: 0.78rem; color: var(--muted); }
.era-btn:hover { transform: translateY(-1px); border-color: rgba(15, 107, 76, 0.35); }
.era-btn.active {
  border-color: var(--accent-2);
  background: linear-gradient(160deg, rgba(255, 244, 232, 0.95), #fff);
  box-shadow: inset 0 0 0 1px rgba(196, 92, 38, 0.25);
}
.era-btn.active b { color: var(--accent-2); }

@media (max-width: 820px) {
  .era-buttons { grid-template-columns: repeat(2, 1fr); }
}

.check-inline {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  color: var(--muted);
  font-size: 0.9rem;
  user-select: none;
}

.quiz-layout {
  display: grid;
  grid-template-columns: 220px 1fr;
  gap: 1.25rem;
}

.nav-pane {
  border-right: 1px solid var(--line);
  padding-right: 1rem;
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}
.nav-head {
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--muted);
}
.nav-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 0.35rem;
  max-height: 420px;
  overflow: auto;
  padding-right: 0.2rem;
}
.nav-btn {
  aspect-ratio: 1;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #fff;
  font-size: 0.72rem;
  font-weight: 600;
  cursor: pointer;
  color: var(--ink);
}
.nav-btn.current {
  border-color: var(--accent);
  box-shadow: inset 0 0 0 1px var(--accent);
}
.nav-btn.answered { background: #e5f4ec; }
.nav-btn.correct { background: #d9f0e3; color: var(--good); }
.nav-btn.wrong { background: #fde8e6; color: var(--bad); }
.nav-btn.essay-done { background: #fff4e8; }

.q-meta {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  margin-bottom: 0.75rem;
}
.badge {
  display: inline-flex;
  align-items: center;
  padding: 0.25rem 0.65rem;
  border-radius: 999px;
  background: rgba(15, 107, 76, 0.12);
  color: var(--accent);
  font-size: 0.78rem;
  font-weight: 600;
}
.badge.format {
  background: rgba(196, 92, 38, 0.12);
  color: var(--accent-2);
}
.q-num { color: var(--muted); font-size: 0.85rem; }
.q-stem {
  font-size: 1.2rem;
  font-weight: 700;
  margin: 0 0 1rem;
  white-space: pre-wrap;
  letter-spacing: -0.01em;
}
.q-passage {
  background: rgba(20, 32, 28, 0.04);
  border-left: 3px solid var(--accent);
  padding: 0.9rem 1rem;
  margin-bottom: 1rem;
  border-radius: 0 12px 12px 0;
  color: var(--muted);
  white-space: pre-wrap;
}

.choices { display: flex; flex-direction: column; gap: 0.55rem; }
.choice {
  text-align: left;
  width: 100%;
  padding: 0.85rem 1rem;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: #fff;
  cursor: pointer;
  font-family: var(--font-body);
  font-size: 0.95rem;
  display: flex;
  gap: 0.7rem;
  align-items: flex-start;
  transition: border-color 0.2s ease, background 0.2s ease;
}
.choice:hover { border-color: rgba(15, 107, 76, 0.4); }
.choice.selected {
  border-color: var(--accent);
  background: rgba(15, 107, 76, 0.08);
}
.choice.correct {
  border-color: var(--good);
  background: rgba(27, 122, 74, 0.12);
}
.choice.wrong {
  border-color: var(--bad);
  background: rgba(180, 35, 24, 0.08);
}
.choice-key {
  font-family: var(--font-display);
  font-weight: 700;
  color: var(--accent);
  min-width: 1.2rem;
}

.essay-box label {
  display: block;
  font-weight: 600;
  margin-bottom: 0.4rem;
  font-size: 0.9rem;
}
.essay-box textarea {
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 0.9rem 1rem;
  font-family: var(--font-body);
  font-size: 0.95rem;
  resize: vertical;
  background: #fff;
  color: var(--ink);
}
.essay-box textarea:focus {
  outline: 2px solid rgba(15, 107, 76, 0.35);
  border-color: var(--accent);
}

.feedback {
  margin-top: 1rem;
  padding: 0.95rem 1rem;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: #fff;
  animation: rise 0.35s ease both;
}
.feedback.ok { border-color: rgba(27, 122, 74, 0.35); background: #f1faf5; }
.feedback.no { border-color: rgba(180, 35, 24, 0.3); background: #fff6f5; }
.feedback.essay { border-color: rgba(196, 92, 38, 0.3); background: #fff8f2; }
.feedback strong { display: block; margin-bottom: 0.35rem; }
.feedback .model {
  margin-top: 0.65rem;
  padding-top: 0.65rem;
  border-top: 1px dashed var(--line);
  color: var(--muted);
  white-space: pre-wrap;
}

.action-row {
  display: flex;
  flex-wrap: wrap;
  gap: 0.6rem;
  margin-top: 1.25rem;
  justify-content: flex-end;
}

.score-ring-wrap { display: flex; justify-content: center; margin: 1.25rem 0 1.5rem; }
.score-ring {
  width: 160px;
  height: 160px;
  border-radius: 50%;
  display: grid;
  place-content: center;
  text-align: center;
  background:
    radial-gradient(circle at center, #fff 58%, transparent 59%),
    conic-gradient(var(--accent) var(--p, 0%), rgba(20, 32, 28, 0.1) 0);
  animation: popIn 0.6s ease both;
}
.score-ring strong {
  font-family: var(--font-display);
  font-size: 2rem;
  line-height: 1;
}
.score-ring span { color: var(--muted); font-size: 0.85rem; }

.subject-scores {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 0.7rem;
  margin-bottom: 1.5rem;
}
.subject-scores article {
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 0.8rem 0.9rem;
  background: rgba(255, 255, 255, 0.75);
}
.subject-scores h3 {
  margin: 0 0 0.25rem;
  font-size: 0.88rem;
}
.subject-scores p {
  margin: 0;
  color: var(--muted);
  font-size: 0.85rem;
}

@media (max-width: 820px) {
  .quiz-layout { grid-template-columns: 1fr; }
  .nav-pane {
    border-right: none;
    border-bottom: 1px solid var(--line);
    padding-right: 0;
    padding-bottom: 1rem;
  }
  .nav-grid {
    max-height: none;
    grid-template-columns: repeat(10, 1fr);
  }
  .subject-grid,
  .subject-scores { grid-template-columns: repeat(2, 1fr); }
  .topbar { flex-direction: column; align-items: flex-start; }
}

@media (max-width: 520px) {
  .subject-grid,
  .subject-scores { grid-template-columns: 1fr; }
  .nav-grid { grid-template-columns: repeat(5, 1fr); }
  .action-row { justify-content: stretch; }
  .action-row .btn { flex: 1; }
}

</style>
</head>
<body>
  <div class="bg-layer" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">史</span>
      <div class="brand-text">
        <strong>시대별 인물 CBT</strong>
        <span>Set 6 · 활약상 중심 · 역사만</span>
      </div>
    </div>
    <div class="top-meta" id="topMeta" hidden>
      <div class="timer" id="timer" aria-live="polite">30:00</div>
      <div class="progress-wrap">
        <div class="progress-label"><span id="answeredCount">0</span> / <span id="totalCount">40</span></div>
        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      </div>
    </div>
  </header>

  <main>
    <section class="panel start-panel" id="startPanel">
      <p class="eyebrow">History Only · Set 6</p>
      <h1>시대를 고르고<br />인물로 복습</h1>
      <p class="lead">시대별 10문항 · 전체 40문항 · 연도 암기 없음</p>

      <div class="focus-banner" id="focusBanner"></div>

      <p class="era-label">풀 시대 선택</p>
      <div class="era-buttons" id="eraButtons" aria-label="시대 선택"></div>
      <p class="hint" id="eraCount">전체 40문항</p>

      <div class="cta-row" style="margin-top:1.25rem">
        <button type="button" class="btn primary" id="startBtn">선택한 범위 풀기</button>
        <a class="btn secondary" href="study.html">인물 카드</a>
        <label class="check-inline">
          <input type="checkbox" id="timerToggle" checked />
          타이머
        </label>
      </div>
    </section>

    <section class="panel quiz-panel" id="quizPanel" hidden>
      <div class="quiz-layout">
        <aside class="nav-pane" aria-label="문항 번호">
          <div class="nav-head">문항</div>
          <div class="nav-grid" id="navGrid"></div>
          <button type="button" class="btn ghost full" id="submitAllBtn">제출 · 결과</button>
        </aside>

        <div class="question-pane">
          <div class="q-meta">
            <span class="badge" id="qSubject"></span>
            <span class="badge format" id="qFormat" hidden></span>
            <span class="q-num" id="qNum"></span>
          </div>
          <h2 class="q-stem" id="qStem"></h2>
          <div class="q-passage" id="qPassage" hidden></div>
          <div class="choices" id="choices"></div>
          <div class="feedback" id="feedback" hidden></div>
          <div class="action-row">
            <button type="button" class="btn ghost" id="prevBtn">이전</button>
            <button type="button" class="btn secondary" id="checkBtn">정답 확인</button>
            <button type="button" class="btn primary" id="nextBtn">다음</button>
          </div>
        </div>
      </div>
    </section>

    <section class="panel result-panel" id="resultPanel" hidden>
      <p class="eyebrow">결과</p>
      <h1 id="scoreTitle">채점 완료</h1>
      <p class="lead" id="scoreLead"></p>
      <div class="score-ring-wrap">
        <div class="score-ring" id="scoreRing">
          <strong id="scorePct">0%</strong>
          <span id="scoreFrac">0 / 40</span>
        </div>
      </div>
      <div class="weakness-box" id="weaknessBox"></div>
      <div class="subject-scores" id="subjectScores"></div>
      <div class="cta-row">
        <button type="button" class="btn primary" id="reviewBtn">오답 다시보기</button>
        <a class="btn secondary" href="study.html">인물 카드</a>
        <button type="button" class="btn ghost" id="restartBtn">시대 다시 선택</button>
      </div>
    </section>
  </main>

  <script>
/* History Set 6 — era-grouped, people/achievements, no year pedantry */
window.NCS_META = {
  version: 6,
  focus: ["역사상식"],
  focusNote:
    "시대별로 풀 수 있습니다. 인물·활약 중심이며 Set 5와 문항을 겹치지 않게 새로 구성했습니다.",
  eras: ["고대·남북국", "고려", "조선", "근현대"]
};

window.NCS_QUESTIONS = [
  // ===== 고대·남북국 1–10 =====
  {
    id: 1, era: "고대·남북국", subject: "역사상식", format: "인물·활약", type: "mc",
    stem: "백제 전성기를 이끌며 마한 세력을 통합하고 고구려·신라와 대립한 왕으로 알려진 인물은?",
    choices: ["온조", "근초고왕", "성왕", "무왕", "의자왕"],
    answer: 1, explain: "근초고왕 때 백제가 전성기를 맞이했다."
  },

    choices: ["윤봉길", "이봉창", "안중근", "김상옥", "나석주"],
    answer: 1, explain: "이봉창 의사가 도쿄에서 의거를 단행했다."
  },
  {
    id: 39, era: "근현대", subject: "역사상식", format: "인물·활약", type: "mc",
    stem: "대한민국 임시정부에서 광복군 창설을 이끌며 무장 독립 투쟁을 강조한 지도자로 알맞은 것은?",
    choices: ["이승만", "김구", "박헌영", "여운형", "장면"],
    answer: 1, explain: "김구가 임시정부·광복군 노선을 이끌었다."
  },
  {
    id: 40, era: "근현대", subject: "역사상식", format: "인물·활약", type: "mc",
    stem: "건국준비위원회를 조직하며 좌우 합작과 통일 정부를 모색한 인물은?",
    choices: ["여운형", "이승만", "김성수", "장덕수", "조만식"],
    answer: 0, explain: "몽양 여운형이 건준·좌우합작 운동에 힘썼다."
  }
];

(() => {
  const ALL = window.NCS_QUESTIONS;
  const META = window.NCS_META || {};
  const KEYS = ["①", "②", "③", "④", "⑤"];
  const ERAS = META.eras || ["고대·남북국", "고려", "조선", "근현대"];
  const STORAGE_KEY = "ncs-cbt-history-era-v6";
  const DEFAULT_SECONDS = 30 * 60;

  let Q = ALL;
  let TOTAL = Q.length;

  const state = {
    era: "전체",
    index: 0,
    answers: [],
    checked: [],
    results: [],
    timerOn: true,
    seconds: DEFAULT_SECONDS,
    timerId: null,
    started: false,
    finished: false
  };

  const $ = (id) => document.getElementById(id);
  const startPanel = $("startPanel");
  const quizPanel = $("quizPanel");
  const resultPanel = $("resultPanel");
  const topMeta = $("topMeta");

  function resetArrays() {
    TOTAL = Q.length;
    state.answers = Array(TOTAL).fill(null);
    state.checked = Array(TOTAL).fill(false);
    state.results = Array(TOTAL).fill(null);
    state.index = 0;
    if ($("totalCount")) $("totalCount").textContent = String(TOTAL);
  }

  function setEra(era) {
    state.era = era;
    Q = era === "전체" ? ALL : ALL.filter((q) => q.era === era);
    resetArrays();
    document.querySelectorAll(".era-btn").forEach((btn) => {
      btn.classList.toggle("active", btn.dataset.era === era);
    });
    const countEl = $("eraCount");
    if (countEl) {
      countEl.textContent =
        era === "전체"
          ? `전체 ${ALL.length}문항`
          : `${era} ${Q.length}문항`;
    }
  }

  function renderEraButtons() {
    const wrap = $("eraButtons");
    if (!wrap) return;
    wrap.innerHTML = "";
    ["전체", ...ERAS].forEach((era) => {
      const n = era === "전체" ? ALL.length : ALL.filter((q) => q.era === era).length;
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "era-btn" + (era === state.era ? " active" : "");
      btn.dataset.era = era;
      btn.innerHTML = `<b>${era}</b><span>${n}문항</span>`;
      btn.addEventListener("click", () => setEra(era));
      wrap.appendChild(btn);
    });
  }

  function renderFocusBanner() {
    const box = $("focusBanner");
    box.innerHTML = `<strong>시대별 인물·활약</strong><span>${META.focusNote || ""}</span>`;
  }

  function answeredCount() {
    return state.answers.filter((a) => a !== null).length;
  }

  function updateProgress() {
    const n = answeredCount();
    $("answeredCount").textContent = String(n);
    $("progressFill").style.width = TOTAL ? `${(n / TOTAL) * 100}%` : "0%";
  }

  function formatTime(sec) {
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
  }

  function tickTimer() {
    const el = $("timer");
    el.textContent = formatTime(state.seconds);
    el.classList.toggle("warn", state.seconds <= 180 && state.seconds > 60);
    el.classList.toggle("danger", state.seconds <= 60);
    if (state.seconds <= 0) {
      clearInterval(state.timerId);
      finishTest(true);
      return;
    }
    state.seconds -= 1;
  }

  function buildNav() {
    const grid = $("navGrid");
    grid.innerHTML = "";
    Q.forEach((q, i) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "nav-btn";
      btn.textContent = String(i + 1);
      btn.title = `${q.era} · ${q.choices[q.answer] || ""}`;
      btn.addEventListener("click", () => {
        state.index = i;
        renderQuestion();
      });
      grid.appendChild(btn);
    });
  }

  function refreshNav() {
    const buttons = $("navGrid").children;
    [...buttons].forEach((btn, i) => {
      btn.classList.remove("current", "answered", "correct", "wrong");
      if (i === state.index) btn.classList.add("current");
      if (state.answers[i] !== null) btn.classList.add("answered");
      if (state.checked[i]) {
        if (state.results[i] === true) btn.classList.add("correct");
        else if (state.results[i] === false) btn.classList.add("wrong");
      }
    });
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

  function showFeedback(title, kind, explain) {
    const box = $("feedback");
    box.hidden = false;
    box.className = `feedback ${kind}`;
    box.innerHTML = `<strong>${title}</strong>${explain ? `<div>${explain}</div>` : ""}`;
  }

  function checkCurrent() {
    const i = state.index;
    const q = Q[i];
    if (state.answers[i] === null) {
      showFeedback("답을 선택한 뒤 확인하세요.", "no");
      return;
    }
    const correct = state.answers[i] === q.answer;
    state.checked[i] = true;
    state.results[i] = correct;
    renderQuestion();
    showFeedback(
      correct ? "정답입니다." : `오답입니다. 정답은 ${KEYS[q.answer]}입니다.`,
      correct ? "ok" : "no",
      q.explain
    );
    updateProgress();
    refreshNav();
  }

  function renderQuestion() {
    const i = state.index;
    const q = Q[i];
    $("qSubject").textContent = q.era;
    const fmt = $("qFormat");
    fmt.hidden = false;
    fmt.textContent = q.format || "인물·활약";
    $("qNum").textContent = `${i + 1} / ${TOTAL}`;
    $("qStem").textContent = q.stem;

    const passage = $("qPassage");
    if (q.passage) {
      passage.hidden = false;
      passage.textContent = q.passage;
    } else {
      passage.hidden = true;
      passage.textContent = "";
    }

    const choices = $("choices");
    const feedback = $("feedback");
    feedback.hidden = true;
    feedback.innerHTML = "";
    choices.innerHTML = "";

    q.choices.forEach((c, ci) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "choice";
      if (state.answers[i] === ci) btn.classList.add("selected");
      if (state.checked[i]) {
        if (ci === q.answer) btn.classList.add("correct");
        else if (state.answers[i] === ci) btn.classList.add("wrong");
      }
      btn.innerHTML = `<span class="choice-key">${KEYS[ci]}</span><span>${escapeHtml(c)}</span>`;
      btn.addEventListener("click", () => {
        if (state.finished) return;
        state.answers[i] = ci;
        state.checked[i] = false;
        state.results[i] = null;
        renderQuestion();
        updateProgress();
        refreshNav();
      });
      choices.appendChild(btn);
    });

    if (state.checked[i]) {
      const correct = state.results[i] === true;
      showFeedback(
        correct ? "정답입니다." : `오답입니다. 정답은 ${KEYS[q.answer]}입니다.`,
        correct ? "ok" : "no",
        q.explain
      );
    }

    $("prevBtn").disabled = i === 0;
    $("nextBtn").textContent = i === TOTAL - 1 ? "결과 보기" : "다음";
    refreshNav();
  }

  function startTest() {
    if (!Q.length) {
      alert("선택한 시대에 문항이 없습니다.");
      return;
    }
    state.started = true;
    state.finished = false;
    resetArrays();
    state.timerOn = $("timerToggle").checked;
    state.seconds = state.era === "전체" ? DEFAULT_SECONDS : 12 * 60;

    startPanel.hidden = true;
    resultPanel.hidden = true;
    quizPanel.hidden = false;
    topMeta.hidden = false;

    buildNav();
    renderQuestion();
    updateProgress();

    if (state.timerId) clearInterval(state.timerId);
    if (state.timerOn) {
      $("timer").hidden = false;
      tickTimer();
      state.timerId = setInterval(tickTimer, 1000);
    } else {
      $("timer").hidden = true;
    }
  }

  function finishTest(fromTimer) {
    if (state.timerId) clearInterval(state.timerId);
    state.finished = true;

    let correct = 0;
    const wrong = [];
    const byEra = {};
    Q.forEach((q, i) => {
      if (!byEra[q.era]) byEra[q.era] = { name: q.era, correct: 0, total: 0 };
      byEra[q.era].total += 1;
      const ok = state.answers[i] === q.answer;
      state.results[i] = ok;
      state.checked[i] = true;
      if (ok) {
        correct += 1;
        byEra[q.era].correct += 1;
      } else {
        wrong.push(q.choices[q.answer] || q.stem.slice(0, 20));
      }
    });

    const pct = TOTAL ? Math.round((correct / TOTAL) * 100) : 0;
    try {
      const hist = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
      hist.unshift({ at: Date.now(), era: state.era, correct, total: TOTAL, wrong });
      localStorage.setItem(STORAGE_KEY, JSON.stringify(hist.slice(0, 10)));
    } catch (_) {}

    quizPanel.hidden = true;
    resultPanel.hidden = false;
    $("scoreTitle").textContent = fromTimer ? "시간 종료 · 자동 제출" : "채점 완료";
    $("scoreLead").textContent = `${state.era} · ${correct}/${TOTAL}`;
    $("scorePct").textContent = `${pct}%`;
    $("scoreFrac").textContent = `${correct} / ${TOTAL}`;
    $("scoreRing").style.setProperty("--p", `${pct}%`);

    const wbox = $("weaknessBox");
    if (wrong.length) {
      const uniq = [...new Set(wrong)].slice(0, 8);
      wbox.innerHTML =
        `<strong>다시 볼 인물</strong>` +
        uniq.map((n) => `<div class="weak-row"><span>${n}</span></div>`).join("") +
        `<p class="weak-tip">해당 시대 카드만 다시 보고 같은 시대를 한 번 더 풀어보세요.</p>`;
    } else {
      wbox.innerHTML = `<strong>완벽합니다</strong><p class="weak-tip">다른 시대로 이어서 풀어보세요.</p>`;
    }

    const box = $("subjectScores");
    box.innerHTML = "";
    Object.values(byEra).forEach((s) => {
      const rate = Math.round((s.correct / s.total) * 100);
      const art = document.createElement("article");
      if (rate < 70) art.classList.add("weak");
      art.innerHTML = `<h3>${s.name}</h3><p>${s.correct} / ${s.total} · ${rate}%</p>`;
      box.appendChild(art);
    });
  }

  $("startBtn").addEventListener("click", startTest);
  $("checkBtn").addEventListener("click", checkCurrent);
  $("prevBtn").addEventListener("click", () => {
    if (state.index > 0) {
      state.index -= 1;
      renderQuestion();
    }
  });
  $("nextBtn").addEventListener("click", () => {
    if (state.index < TOTAL - 1) {
      state.index += 1;
      renderQuestion();
    } else finishTest(false);
  });
  $("submitAllBtn").addEventListener("click", () => {
    if (confirm("제출하고 결과를 볼까요?")) finishTest(false);
  });
  $("reviewBtn").addEventListener("click", () => {
    resultPanel.hidden = true;
    quizPanel.hidden = false;
    const firstWrong = state.results.findIndex((r) => r === false);
    state.index = firstWrong >= 0 ? firstWrong : 0;
    renderQuestion();
  });
  $("restartBtn").addEventListener("click", () => {
    startPanel.hidden = false;
    resultPanel.hidden = true;
    quizPanel.hidden = true;
    topMeta.hidden = true;
    if (state.timerId) clearInterval(state.timerId);
    renderFocusBanner();
  });

  document.addEventListener("keydown", (e) => {
    if (!state.started || state.finished || quizPanel.hidden) return;
    if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) return;
    const q = Q[state.index];
    if (e.key >= "1" && e.key <= "5") {
      const ci = Number(e.key) - 1;
      if (ci < q.choices.length) {
        state.answers[state.index] = ci;
        state.checked[state.index] = false;
        renderQuestion();
        updateProgress();
      }
    }
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) checkCurrent();
  });

  renderEraButtons();
  setEra("전체");
  renderFocusBanner();
})();

</script>
</body>
</html>
