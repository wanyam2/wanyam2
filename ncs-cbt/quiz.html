<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NCS 고등학교 CBT · 50문항</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet" />
  <style>
:root {
  --ink: #14201c;
  --muted: #4a5c55;
  --paper: #f3f7f4;
  --panel: rgba(255, 255, 255, 0.86);
  --line: rgba(20, 32, 28, 0.12);
  --accent: #0f6b4c;
  --accent-2: #c45c26;
  --good: #1b7a4a;
  --bad: #b42318;
  --warn: #9a6700;
  --shadow: 0 18px 50px rgba(15, 40, 30, 0.12);
  --radius: 18px;
  --font-display: "Outfit", "IBM Plex Sans KR", sans-serif;
  --font-body: "IBM Plex Sans KR", sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  font-family: var(--font-body);
  color: var(--ink);
  background: #dfeae3;
  line-height: 1.55;
}

.bg-layer {
  position: fixed;
  inset: 0;
  z-index: -1;
  background:
    radial-gradient(1000px 500px at 10% -10%, rgba(196, 92, 38, 0.18), transparent 55%),
    radial-gradient(900px 480px at 100% 0%, rgba(15, 107, 76, 0.22), transparent 50%),
    linear-gradient(160deg, #e8f1ec 0%, #f7f3ee 45%, #d9e8df 100%);
  animation: drift 18s ease-in-out infinite alternate;
}
.bg-layer::after {
  content: "";
  position: absolute;
  inset: 0;
  opacity: 0.35;
  background-image:
    linear-gradient(rgba(20, 32, 28, 0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(20, 32, 28, 0.03) 1px, transparent 1px);
  background-size: 28px 28px;
  mask-image: radial-gradient(ellipse at center, black 40%, transparent 80%);
}

@keyframes drift {
  from { transform: scale(1) translateY(0); }
  to { transform: scale(1.04) translateY(-8px); }
}

.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 1rem;
  padding: 1rem 1.25rem;
  border-bottom: 1px solid var(--line);
  backdrop-filter: blur(10px);
  background: rgba(255, 255, 255, 0.55);
  position: sticky;
  top: 0;
  z-index: 10;
}

.brand { display: flex; align-items: center; gap: 0.85rem; }
.brand-mark {
  font-family: var(--font-display);
  font-weight: 800;
  letter-spacing: 0.04em;
  background: var(--ink);
  color: #f4faf6;
  width: 3rem;
  height: 3rem;
  border-radius: 12px;
  display: grid;
  place-items: center;
  animation: popIn 0.6s ease both;
}
.brand-text { display: flex; flex-direction: column; }
.brand-text strong {
  font-family: var(--font-display);
  font-size: 1.05rem;
  letter-spacing: -0.02em;
}
.brand-text span { font-size: 0.78rem; color: var(--muted); }

.top-meta { display: flex; align-items: center; gap: 1rem; }
.timer {
  font-family: var(--font-display);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  background: #12241d;
  color: #e8fff4;
  padding: 0.45rem 0.75rem;
  border-radius: 999px;
  min-width: 4.5rem;
  text-align: center;
}
.timer.warn { background: var(--accent-2); }
.timer.danger { background: var(--bad); animation: pulse 1s ease infinite; }

@keyframes pulse {
  50% { transform: scale(1.04); }
}

.progress-wrap { min-width: 8rem; }
.progress-label { font-size: 0.75rem; color: var(--muted); margin-bottom: 0.25rem; }
.progress-track {
  height: 6px;
  background: rgba(20, 32, 28, 0.1);
  border-radius: 999px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, var(--accent), #2a9d6e);
  transition: width 0.35s ease;
}

main {
  max-width: 1100px;
  margin: 0 auto;
  padding: 1.5rem 1rem 3rem;
}

.panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 1.75rem;
  animation: rise 0.55s ease both;
}

@keyframes rise {
  from { opacity: 0; transform: translateY(14px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes popIn {
  from { opacity: 0; transform: scale(0.86); }
  to { opacity: 1; transform: scale(1); }
}

.eyebrow {
  text-transform: uppercase;
  letter-spacing: 0.14em;
  font-size: 0.72rem;
  font-weight: 600;
  color: var(--accent);
  margin: 0 0 0.6rem;
}
h1 {
  font-family: var(--font-display);
  font-weight: 800;
  letter-spacing: -0.03em;
  font-size: clamp(2rem, 5vw, 3.1rem);
  line-height: 1.15;
  margin: 0 0 0.75rem;
}
.lead { color: var(--muted); margin: 0 0 1.5rem; font-size: 1.05rem; }
.hint { color: var(--muted); font-size: 0.9rem; margin: 1rem 0 0; }

.subject-grid {
  list-style: none;
  padding: 0;
  margin: 0 0 1.5rem;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 0.75rem;
}
.subject-grid li {
  padding: 0.9rem 1rem;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: rgba(255, 255, 255, 0.7);
  display: flex;
  flex-direction: column;
  gap: 0.2rem;
  transition: transform 0.25s ease, border-color 0.25s ease;
}
.subject-grid li:hover {
  transform: translateY(-2px);
  border-color: rgba(15, 107, 76, 0.35);
}
.subject-grid b { font-size: 0.95rem; }
.subject-grid span { color: var(--muted); font-size: 0.82rem; }

.cta-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.85rem;
}

.btn {
  font-family: var(--font-body);
  font-weight: 600;
  border: none;
  cursor: pointer;
  border-radius: 12px;
  padding: 0.75rem 1.15rem;
  font-size: 0.95rem;
  transition: transform 0.15s ease, background 0.2s ease, opacity 0.2s ease;
}
.btn:hover { transform: translateY(-1px); }
.btn:active { transform: translateY(0); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
.btn.primary { background: var(--accent); color: #fff; }
.btn.primary:hover { background: #0c5a40; }
.btn.secondary { background: #1d2f28; color: #f3fff8; }
.btn.ghost {
  background: transparent;
  border: 1px solid var(--line);
  color: var(--ink);
}
.btn.full { width: 100%; }

.check-inline {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  color: var(--muted);
  font-size: 0.9rem;
  user-select: none;
}

.quiz-layout {
  display: grid;
  grid-template-columns: 220px 1fr;
  gap: 1.25rem;
}

.nav-pane {
  border-right: 1px solid var(--line);
  padding-right: 1rem;
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}
.nav-head {
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--muted);
}
.nav-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 0.35rem;
  max-height: 420px;
  overflow: auto;
  padding-right: 0.2rem;
}
.nav-btn {
  aspect-ratio: 1;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #fff;
  font-size: 0.72rem;
  font-weight: 600;
  cursor: pointer;
  color: var(--ink);
}
.nav-btn.current {
  border-color: var(--accent);
  box-shadow: inset 0 0 0 1px var(--accent);
}
.nav-btn.answered { background: #e5f4ec; }
.nav-btn.correct { background: #d9f0e3; color: var(--good); }
.nav-btn.wrong { background: #fde8e6; color: var(--bad); }
.nav-btn.essay-done { background: #fff4e8; }

.q-meta {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  margin-bottom: 0.75rem;
}
.badge {
  display: inline-flex;
  align-items: center;
  padding: 0.25rem 0.65rem;
  border-radius: 999px;
  background: rgba(15, 107, 76, 0.12);
  color: var(--accent);
  font-size: 0.78rem;
  font-weight: 600;
}
.q-num { color: var(--muted); font-size: 0.85rem; }
.q-stem {
  font-size: 1.2rem;
  font-weight: 700;
  margin: 0 0 1rem;
  white-space: pre-wrap;
  letter-spacing: -0.01em;
}
.q-passage {
  background: rgba(20, 32, 28, 0.04);
  border-left: 3px solid var(--accent);
  padding: 0.9rem 1rem;
  margin-bottom: 1rem;
  border-radius: 0 12px 12px 0;
  color: var(--muted);
  white-space: pre-wrap;
}

.choices { display: flex; flex-direction: column; gap: 0.55rem; }
.choice {
  text-align: left;
  width: 100%;
  padding: 0.85rem 1rem;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: #fff;
  cursor: pointer;
  font-family: var(--font-body);
  font-size: 0.95rem;
  display: flex;
  gap: 0.7rem;
  align-items: flex-start;
  transition: border-color 0.2s ease, background 0.2s ease;
}
.choice:hover { border-color: rgba(15, 107, 76, 0.4); }
.choice.selected {
  border-color: var(--accent);
  background: rgba(15, 107, 76, 0.08);
}
.choice.correct {
  border-color: var(--good);
  background: rgba(27, 122, 74, 0.12);
}
.choice.wrong {
  border-color: var(--bad);
  background: rgba(180, 35, 24, 0.08);
}
.choice-key {
  font-family: var(--font-display);
  font-weight: 700;
  color: var(--accent);
  min-width: 1.2rem;
}

.essay-box label {
  display: block;
  font-weight: 600;
  margin-bottom: 0.4rem;
  font-size: 0.9rem;
}
.essay-box textarea {
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 0.9rem 1rem;
  font-family: var(--font-body);
  font-size: 0.95rem;
  resize: vertical;
  background: #fff;
  color: var(--ink);
}
.essay-box textarea:focus {
  outline: 2px solid rgba(15, 107, 76, 0.35);
  border-color: var(--accent);
}

.feedback {
  margin-top: 1rem;
  padding: 0.95rem 1rem;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: #fff;
  animation: rise 0.35s ease both;
}
.feedback.ok { border-color: rgba(27, 122, 74, 0.35); background: #f1faf5; }
.feedback.no { border-color: rgba(180, 35, 24, 0.3); background: #fff6f5; }
.feedback.essay { border-color: rgba(196, 92, 38, 0.3); background: #fff8f2; }
.feedback strong { display: block; margin-bottom: 0.35rem; }
.feedback .model {
  margin-top: 0.65rem;
  padding-top: 0.65rem;
  border-top: 1px dashed var(--line);
  color: var(--muted);
  white-space: pre-wrap;
}

.action-row {
  display: flex;
  flex-wrap: wrap;
  gap: 0.6rem;
  margin-top: 1.25rem;
  justify-content: flex-end;
}

.score-ring-wrap { display: flex; justify-content: center; margin: 1.25rem 0 1.5rem; }
.score-ring {
  width: 160px;
  height: 160px;
  border-radius: 50%;
  display: grid;
  place-content: center;
  text-align: center;
  background:
    radial-gradient(circle at center, #fff 58%, transparent 59%),
    conic-gradient(var(--accent) var(--p, 0%), rgba(20, 32, 28, 0.1) 0);
  animation: popIn 0.6s ease both;
}
.score-ring strong {
  font-family: var(--font-display);
  font-size: 2rem;
  line-height: 1;
}
.score-ring span { color: var(--muted); font-size: 0.85rem; }

.subject-scores {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 0.7rem;
  margin-bottom: 1.5rem;
}
.subject-scores article {
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 0.8rem 0.9rem;
  background: rgba(255, 255, 255, 0.75);
}
.subject-scores h3 {
  margin: 0 0 0.25rem;
  font-size: 0.88rem;
}
.subject-scores p {
  margin: 0;
  color: var(--muted);
  font-size: 0.85rem;
}

@media (max-width: 820px) {
  .quiz-layout { grid-template-columns: 1fr; }
  .nav-pane {
    border-right: none;
    border-bottom: 1px solid var(--line);
    padding-right: 0;
    padding-bottom: 1rem;
  }
  .nav-grid {
    max-height: none;
    grid-template-columns: repeat(10, 1fr);
  }
  .subject-grid,
  .subject-scores { grid-template-columns: repeat(2, 1fr); }
  .topbar { flex-direction: column; align-items: flex-start; }
}

@media (max-width: 520px) {
  .subject-grid,
  .subject-scores { grid-template-columns: 1fr; }
  .nav-grid { grid-template-columns: repeat(5, 1fr); }
  .action-row { justify-content: stretch; }
  .action-row .btn { flex: 1; }
}

</style>
</head>
<body>
  <div class="bg-layer" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">NCS</span>
      <div class="brand-text">
        <strong>고등학교 CBT</strong>
        <span>일반상식 · 역사 · 수리/물리 · 영어 · 논리 · 논술</span>
      </div>
    </div>
    <div class="top-meta" id="topMeta" hidden>
      <div class="timer" id="timer" aria-live="polite">60:00</div>
      <div class="progress-wrap">
        <div class="progress-label"><span id="answeredCount">0</span> / 50</div>
        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      </div>
    </div>
  </header>

  <main>
    <!-- START -->
    <section class="panel start-panel" id="startPanel">
      <p class="eyebrow">Computer Based Test</p>
      <h1>NCS 형식<br />고등학교 수준 퀴즈</h1>
      <p class="lead">총 50문항 · 과목별 혼합 · 즉시 채점 · 해설 제공</p>

      <ul class="subject-grid" aria-label="과목 구성">
        <li><b>일반상식</b><span>8문항</span></li>
        <li><b>역사상식</b><span>8문항</span></li>
        <li><b>수리·물리</b><span>10문항</span></li>
        <li><b>영어</b><span>8문항</span></li>
        <li><b>논리</b><span>8문항</span></li>
        <li><b>논술</b><span>8문항</span></li>
      </ul>

      <div class="cta-row">
        <button type="button" class="btn primary" id="startBtn">시험 시작</button>
        <label class="check-inline">
          <input type="checkbox" id="timerToggle" checked />
          60분 타이머
        </label>
      </div>
      <p class="hint">객관식은 선택 후 바로 채점할 수 있고, 논술은 제출 후 모범답안과 비교합니다.</p>
    </section>

    <!-- QUIZ -->
    <section class="panel quiz-panel" id="quizPanel" hidden>
      <div class="quiz-layout">
        <aside class="nav-pane" aria-label="문항 번호">
          <div class="nav-head">문항</div>
          <div class="nav-grid" id="navGrid"></div>
          <button type="button" class="btn ghost full" id="submitAllBtn">전체 제출 · 결과</button>
        </aside>

        <div class="question-pane">
          <div class="q-meta">
            <span class="badge" id="qSubject"></span>
            <span class="q-num" id="qNum"></span>
          </div>
          <h2 class="q-stem" id="qStem"></h2>
          <div class="q-passage" id="qPassage" hidden></div>
          <div class="choices" id="choices"></div>
          <div class="essay-box" id="essayBox" hidden>
            <label for="essayInput">답안 작성</label>
            <textarea id="essayInput" rows="8" placeholder="핵심 논점과 근거를 간결히 작성하세요."></textarea>
          </div>
          <div class="feedback" id="feedback" hidden></div>
          <div class="action-row">
            <button type="button" class="btn ghost" id="prevBtn">이전</button>
            <button type="button" class="btn secondary" id="checkBtn">정답 확인</button>
            <button type="button" class="btn primary" id="nextBtn">다음</button>
          </div>
        </div>
      </div>
    </section>

    <!-- RESULT -->
    <section class="panel result-panel" id="resultPanel" hidden>
      <p class="eyebrow">결과</p>
      <h1 id="scoreTitle">채점 완료</h1>
      <p class="lead" id="scoreLead"></p>
      <div class="score-ring-wrap">
        <div class="score-ring" id="scoreRing">
          <strong id="scorePct">0%</strong>
          <span id="scoreFrac">0 / 50</span>
        </div>
      </div>
      <div class="subject-scores" id="subjectScores"></div>
      <div class="cta-row">
        <button type="button" class="btn primary" id="reviewBtn">오답·해설 다시보기</button>
        <button type="button" class="btn ghost" id="restartBtn">다시 풀기</button>
      </div>
    </section>
  </main>

  <script>
/* NCS High School CBT — 50 questions */
window.NCS_QUESTIONS = [
  // ===== 일반상식 (1–8) =====
  {
    id: 1,
    subject: "일반상식",
    type: "mc",
    stem: "대한민국 국회의원 임기는 몇 년인가?",
    choices: ["2년", "3년", "4년", "5년", "6년"],
    answer: 2,
    explain: "헌법상 국회의원 임기는 4년이다."
  },
  {
    id: 2,
    subject: "일반상식",
    type: "mc",
    stem: "다음 중 광합성의 주요 산물로 알맞은 것은?",
    choices: ["이산화탄소와 물", "산소와 포도당", "질소와 암모니아", "메탄과 수소", "오존과 질소"],
    answer: 1,
    explain: "광합성은 빛에너지를 이용해 이산화탄소와 물로 포도당을 만들고 산소를 방출한다."
  },
  {
    id: 3,
    subject: "일반상식",
    type: "mc",
    stem: "OECD의 정식 명칭으로 옳은 것은?",
    choices: [
      "국제통화기금",
      "세계무역기구",
      "경제협력개발기구",
      "국제노동기구",
      "유엔교육과학문화기구"
    ],
    answer: 2,
    explain: "OECD는 Organisation for Economic Co-operation and Development, 즉 경제협력개발기구이다."
  },
  {
    id: 4,
    subject: "일반상식",
    type: "mc",
    stem: "인체에서 DNA가 주로 존재하는 세포 소기관은?",
    choices: ["미토콘드리아", "리보솜", "핵", "골지체", "리소좀"],
    answer: 2,
    explain: "유전 정보의 본체인 DNA는 주로 핵에 존재한다. (미토콘드리아에도 일부 DNA가 있다.)"
  },
  {
    id: 5,
    subject: "일반상식",
    type: "mc",
    stem: "다음 중 ‘삼권분립’에 해당하지 않는 것은?",
    choices: ["입법부", "행정부", "사법부", "감사원", "국회"],
    answer: 3,
    explain: "삼권분립은 입법·행정·사법이다. 감사원은 헌법기관이지만 삼권의 한 축은 아니다. 국회는 입법부에 해당한다."
  },
  {
    id: 6,
    subject: "일반상식",
    type: "mc",
    stem: "지구 온난화의 주요 원인 기체로 가장 널리 지목되는 것은?",
    choices: ["헬륨", "네온", "이산화탄소", "아르곤", "산소"],
    answer: 2,
    explain: "화석연료 연소 등으로 증가한 이산화탄소(CO₂)가 온실효과의 주요 원인으로 꼽힌다."
  },
  {
    id: 7,
    subject: "일반상식",

    modelAnswer: "(협력 선택 예) 협력은 공동 목표 달성과 갈등 조율을 돕는다. 근거1: 프로젝트·동아리에서 역할 분담으로 성과가 커진다. 근거2: 서로 피드백하며 성장하고 소속감이 높아진다. 다만 건강한 경쟁도 동기 부여에 도움이 되므로 둘의 조화가 필요하다.",
    keywords: ["주장", "근거", "협력", "경쟁", "성장"],

    modelAnswer: "허위정보는 여론을 왜곡하고 혐오·불신을 키워 합리적 공론장을 훼손한다. 검증: 출처·작성자를 확인하고, 여러 언론·팩트체크 기관을 교차 확인하며, 자극적 제목만으로 공유하지 않는다. 사진·영상은 역검색 등으로 조작 여부를 살핀다.",
    keywords: ["허위", "여론", "출처", "교차", "검증", "공유"],
    explain: "해악(여론 왜곡 등) + 실천 가능한 미디어 리터러시 방법이 핵심입니다."
  },
  {
    id: 47,
    subject: "논술",
    type: "essay",
    stem: "과학 기술이 발전할수록 개인정보 보호가 중요해지는 이유를 서술하고, 바람직한 제도 또는 개인 수칙을 한 가지 이상 제안하시오.",
    modelAnswer: "빅데이터·AI·IoT로 개인 정보가 대량 수집·결합되면서 감시·차별·유출 위험이 커진다. 제도: 수집 최소화·동의 강화·유출 시 책임 명확화. 개인: 비밀번호 관리, 앱 권한 점검, 불필요한 정보 제공 자제 등이 필요하다.",
    keywords: ["개인정보", "수집", "위험", "동의", "보호", "책임"],
    explain: "기술 발전과 위험의 연결, 그리고 제도/개인 차원의 대응이 있으면 충분합니다."
  },
  {
    id: 48,
    subject: "논술",
    type: "essay",
    stem: "독서의 중요성을 사회·개인 측면에서 각각 설명하시오.",
    modelAnswer: "개인: 어휘·사고력·공감 능력을 키우고 자기 이해를 돕는다. 사회: 시민이 다양한 관점을 이해하면 토론과 민주적 의사결정의 질이 높아지고, 문화적 공통 기반이 형성된다.",
    keywords: ["사고", "공감", "시민", "사회", "관점", "성장"],
    explain: "개인(성장·사고)과 사회(공론·시민성)를 구분해 쓰면 좋습니다."
  },
  {
    id: 49,
    subject: "논술",
    type: "essay",
    stem: "시험을 앞둔 학생에게 ‘벼락치기’보다 분산 학습이 효과적인 이유를 인지·건강 측면에서 논하시오.",
    modelAnswer: "인지: 간격을 두고 반복하면 장기기억으로 전환되기 쉽고, 인출 연습으로 회상력이 강화된다. 벼락치기는 단기 암기에 그치기 쉽다. 건강: 수면 부족은 기억 정착을 방해하고 스트레스를 키운다. 따라서 계획을 나눠 복습하고 수면을 확보하는 편이 낫다.",
    keywords: ["간격", "장기기억", "수면", "반복", "스트레스"],
    explain: "분산 학습·인출·수면과 기억의 관계를 언급하면 고득점 답안입니다."
  },
  {
    id: 50,
    subject: "논술",
    type: "essay",
    stem: "다문화 사회에서 ‘관용’이 필요한 이유를 쓰고, 학교 현장에서 실천할 수 있는 예를 제시하시오.",
    modelAnswer: "서로 다른 언어·문화·배경을 가진 구성원이 늘어나므로, 차이를 존중하는 관용이 갈등을 줄이고 공동체를 유지한다. 학교 예: 문화 소개 행사, 편견을 다루는 토론·독서, 언어 지원 버디 프로그램, 차별적 말투 금지와 존중 규칙 만들기 등.",
    keywords: ["존중", "차이", "갈등", "학교", "편견", "공동체"],
    explain: "필요성(다양성·공동체)과 구체적 학교 실천 사례가 있으면 됩니다."
  }
];

(() => {
  const Q = window.NCS_QUESTIONS;
  const KEYS = ["①", "②", "③", "④", "⑤"];
  const TOTAL = Q.length;
  const ESSAY_PASS = 0.4; // keyword coverage threshold for auto-score hint

  const state = {
    index: 0,
    answers: Array(TOTAL).fill(null), // mc: number | essay: string
    checked: Array(TOTAL).fill(false),
    results: Array(TOTAL).fill(null), // true/false/null (essay: 'partial'|'pass'|'fail')
    timerOn: true,
    seconds: 60 * 60,
    timerId: null,
    started: false,
    finished: false
  };

  const $ = (id) => document.getElementById(id);
  const startPanel = $("startPanel");
  const quizPanel = $("quizPanel");
  const resultPanel = $("resultPanel");
  const topMeta = $("topMeta");

  function answeredCount() {
    return state.answers.filter((a, i) => {
      if (Q[i].type === "essay") return typeof a === "string" && a.trim().length > 0;
      return a !== null;
    }).length;
  }

  function updateProgress() {
    const n = answeredCount();
    $("answeredCount").textContent = String(n);
    $("progressFill").style.width = `${(n / TOTAL) * 100}%`;
  }

  function formatTime(sec) {
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
  }

  function tickTimer() {
    const el = $("timer");
    el.textContent = formatTime(state.seconds);
    el.classList.toggle("warn", state.seconds <= 300 && state.seconds > 60);
    el.classList.toggle("danger", state.seconds <= 60);
    if (state.seconds <= 0) {
      clearInterval(state.timerId);
      finishTest(true);
      return;
    }
    state.seconds -= 1;
  }

  function buildNav() {
    const grid = $("navGrid");
    grid.innerHTML = "";
    Q.forEach((q, i) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "nav-btn";
      btn.textContent = String(i + 1);
      btn.title = q.subject;
      btn.addEventListener("click", () => {
        saveEssayDraft();
        state.index = i;
        renderQuestion();
      });
      grid.appendChild(btn);
    });
  }

  function refreshNav() {
    const buttons = $("navGrid").children;
    [...buttons].forEach((btn, i) => {
      btn.classList.remove("current", "answered", "correct", "wrong", "essay-done");
      if (i === state.index) btn.classList.add("current");
      const a = state.answers[i];
      const has =
        Q[i].type === "essay"
          ? typeof a === "string" && a.trim().length > 0
          : a !== null;
      if (has) btn.classList.add("answered");
      if (state.checked[i]) {
        if (Q[i].type === "essay") btn.classList.add("essay-done");
        else if (state.results[i] === true) btn.classList.add("correct");
        else if (state.results[i] === false) btn.classList.add("wrong");
      }
    });
  }

  function saveEssayDraft() {
    const q = Q[state.index];
    if (q.type !== "essay") return;
    state.answers[state.index] = $("essayInput").value;
  }

  function scoreEssay(text, q) {
    const raw = (text || "").trim();
    if (!raw) return { ok: false, label: "fail", ratio: 0 };
    const lower = raw.toLowerCase();
    const keys = q.keywords || [];
    const hit = keys.filter((k) => lower.includes(k.toLowerCase())).length;
    const ratio = keys.length ? hit / keys.length : 0;
    if (raw.length >= 40 && ratio >= ESSAY_PASS) return { ok: true, label: "pass", ratio, hit, total: keys.length };
    if (raw.length >= 20) return { ok: null, label: "partial", ratio, hit, total: keys.length };
    return { ok: false, label: "fail", ratio, hit, total: keys.length };
  }

  function checkCurrent() {
    const i = state.index;
    const q = Q[i];
    saveEssayDraft();

    if (q.type === "mc") {
      if (state.answers[i] === null) {
        showFeedback("답을 선택한 뒤 확인하세요.", "no");
        return;
      }
      const correct = state.answers[i] === q.answer;
      state.checked[i] = true;
      state.results[i] = correct;
      renderQuestion();
      showFeedback(
        correct ? "정답입니다." : `오답입니다. 정답은 ${KEYS[q.answer]}입니다.`,
        correct ? "ok" : "no",
        q.explain
      );
    } else {
      const text = state.answers[i] || "";
      if (!text.trim()) {
        showFeedback("답안을 작성한 뒤 확인하세요.", "no");
        return;
      }
      const scored = scoreEssay(text, q);
      state.checked[i] = true;
      state.results[i] = scored.label;
      const tip =
        scored.label === "pass"
          ? `자동 평가: 핵심 키워드를 잘 포함했습니다. (${scored.hit}/${scored.total})`
          : scored.label === "partial"
            ? `자동 평가: 부분 충족. 모범답안과 비교해 보완하세요. (키워드 ${scored.hit}/${scored.total})`
            : `자동 평가: 보완 필요. 모범답안을 참고하세요. (키워드 ${scored.hit}/${scored.total})`;
      showFeedback(tip, "essay", q.explain, q.modelAnswer);
    }
    updateProgress();
    refreshNav();
  }

  function showFeedback(title, kind, explain, model) {
    const box = $("feedback");
    box.hidden = false;
    box.className = `feedback ${kind}`;
    let html = `<strong>${title}</strong>`;
    if (explain) html += `<div>${explain}</div>`;
    if (model) html += `<div class="model"><b>모범답안</b><br>${escapeHtml(model)}</div>`;
    box.innerHTML = html;
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

  function renderQuestion() {
    const i = state.index;
    const q = Q[i];
    $("qSubject").textContent = q.subject;
    $("qNum").textContent = `${i + 1} / ${TOTAL}`;
    $("qStem").textContent = q.stem;

    const passage = $("qPassage");
    if (q.passage) {
      passage.hidden = false;
      passage.textContent = q.passage;
    } else {
      passage.hidden = true;
      passage.textContent = "";
    }

    const choices = $("choices");
    const essayBox = $("essayBox");
    const feedback = $("feedback");
    feedback.hidden = true;
    feedback.innerHTML = "";

    if (q.type === "mc") {
      essayBox.hidden = true;
      choices.hidden = false;
      choices.innerHTML = "";
      q.choices.forEach((c, ci) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "choice";
        if (state.answers[i] === ci) btn.classList.add("selected");
        if (state.checked[i]) {
          if (ci === q.answer) btn.classList.add("correct");
          else if (state.answers[i] === ci) btn.classList.add("wrong");
        }
        btn.innerHTML = `<span class="choice-key">${KEYS[ci]}</span><span>${escapeHtml(c)}</span>`;
        btn.addEventListener("click", () => {
          if (state.finished) return;
          state.answers[i] = ci;
          // allow re-check after changing answer
          state.checked[i] = false;
          state.results[i] = null;
          renderQuestion();
          updateProgress();
          refreshNav();
        });
        choices.appendChild(btn);
      });
      if (state.checked[i]) {
        const correct = state.results[i] === true;
        showFeedback(
          correct ? "정답입니다." : `오답입니다. 정답은 ${KEYS[q.answer]}입니다.`,
          correct ? "ok" : "no",
          q.explain
        );
      }
    } else {
      choices.hidden = true;
      choices.innerHTML = "";
      essayBox.hidden = false;
      $("essayInput").value = state.answers[i] || "";
      $("essayInput").oninput = () => {
        state.answers[i] = $("essayInput").value;
        state.checked[i] = false;
        updateProgress();
        refreshNav();
      };
      if (state.checked[i]) {
        const scored = scoreEssay(state.answers[i], q);
        const tip =
          scored.label === "pass"
            ? `자동 평가: 핵심 키워드를 잘 포함했습니다. (${scored.hit}/${scored.total})`
            : scored.label === "partial"
              ? `자동 평가: 부분 충족. 모범답안과 비교해 보완하세요. (키워드 ${scored.hit}/${scored.total})`
              : `자동 평가: 보완 필요. 모범답안을 참고하세요. (키워드 ${scored.hit || 0}/${scored.total || 0})`;
        showFeedback(tip, "essay", q.explain, q.modelAnswer);
      }
    }

    $("prevBtn").disabled = i === 0;
    $("nextBtn").textContent = i === TOTAL - 1 ? "결과 보기" : "다음";
    refreshNav();
  }

  function startTest() {
    state.started = true;
    state.finished = false;
    state.index = 0;
    state.answers = Array(TOTAL).fill(null);
    state.checked = Array(TOTAL).fill(false);
    state.results = Array(TOTAL).fill(null);
    state.timerOn = $("timerToggle").checked;
    state.seconds = 60 * 60;

    startPanel.hidden = true;
    resultPanel.hidden = true;
    quizPanel.hidden = false;
    topMeta.hidden = false;

    buildNav();
    renderQuestion();
    updateProgress();

    if (state.timerId) clearInterval(state.timerId);
    if (state.timerOn) {
      $("timer").hidden = false;
      tickTimer();
      state.timerId = setInterval(tickTimer, 1000);
    } else {
      $("timer").hidden = true;
    }
  }

  function computeScores() {
    const bySubject = {};
    let mcCorrect = 0;
    let mcTotal = 0;
    let essayPass = 0;
    let essayPartial = 0;
    let essayTotal = 0;

    Q.forEach((q, i) => {
      if (!bySubject[q.subject]) bySubject[q.subject] = { correct: 0, total: 0, essayNote: 0 };
      bySubject[q.subject].total += 1;

      if (q.type === "mc") {
        mcTotal += 1;
        const ok = state.answers[i] === q.answer;
        if (ok) {
          mcCorrect += 1;
          bySubject[q.subject].correct += 1;
        }
        state.results[i] = ok;
        state.checked[i] = true;
      } else {
        essayTotal += 1;
        const scored = scoreEssay(state.answers[i], q);
        state.results[i] = scored.label;
        state.checked[i] = true;
        if (scored.label === "pass") {
          essayPass += 1;
          bySubject[q.subject].correct += 1;
        } else if (scored.label === "partial") {
          essayPartial += 1;
          bySubject[q.subject].correct += 0.5;
          bySubject[q.subject].essayNote += 1;
        }
      }
    });

    // Weighted: MC exact + essay pass=1, partial=0.5
    const essayScore = essayPass + essayPartial * 0.5;
    const totalScore = mcCorrect + essayScore;
    return { bySubject, mcCorrect, mcTotal, essayPass, essayPartial, essayTotal, totalScore };
  }

  function finishTest(fromTimer) {
    saveEssayDraft();
    if (state.timerId) clearInterval(state.timerId);
    state.finished = true;

    const scores = computeScores();
    const pct = Math.round((scores.totalScore / TOTAL) * 100);

    quizPanel.hidden = true;
    resultPanel.hidden = false;
    $("scoreTitle").textContent = fromTimer ? "시간 종료 · 자동 제출" : "채점 완료";
    $("scoreLead").textContent =
      `객관식 ${scores.mcCorrect}/${scores.mcTotal} · 논술 충족 ${scores.essayPass} · 부분 ${scores.essayPartial} (논술 ${scores.essayTotal}문항)`;
    $("scorePct").textContent = `${pct}%`;
    $("scoreFrac").textContent = `${scores.totalScore.toFixed(1)} / ${TOTAL}`;
    $("scoreRing").style.setProperty("--p", `${pct}%`);

    const box = $("subjectScores");
    box.innerHTML = "";
    Object.entries(scores.bySubject).forEach(([name, s]) => {
      const art = document.createElement("article");
      art.innerHTML = `<h3>${name}</h3><p>${s.correct.toFixed(1)} / ${s.total}</p>`;
      box.appendChild(art);
    });
  }

  $("startBtn").addEventListener("click", startTest);
  $("checkBtn").addEventListener("click", checkCurrent);
  $("prevBtn").addEventListener("click", () => {
    saveEssayDraft();
    if (state.index > 0) {
      state.index -= 1;
      renderQuestion();
    }
  });
  $("nextBtn").addEventListener("click", () => {
    saveEssayDraft();
    if (state.index < TOTAL - 1) {
      state.index += 1;
      renderQuestion();
    } else {
      finishTest(false);
    }
  });
  $("submitAllBtn").addEventListener("click", () => {
    if (confirm("전체 제출하고 결과를 확인할까요?")) finishTest(false);
  });
  $("reviewBtn").addEventListener("click", () => {
    resultPanel.hidden = true;
    quizPanel.hidden = false;
    state.index = 0;
    renderQuestion();
  });
  $("restartBtn").addEventListener("click", () => {
    startPanel.hidden = false;
    resultPanel.hidden = true;
    quizPanel.hidden = true;
    topMeta.hidden = true;
    if (state.timerId) clearInterval(state.timerId);
  });

  // keyboard: 1-5 select, N/P navigate
  document.addEventListener("keydown", (e) => {
    if (!state.started || state.finished || quizPanel.hidden) return;
    const q = Q[state.index];
    if (e.target && e.target.tagName === "TEXTAREA") return;
    if (q.type === "mc" && e.key >= "1" && e.key <= "5") {
      const ci = Number(e.key) - 1;
      if (ci < q.choices.length) {
        state.answers[state.index] = ci;
        state.checked[state.index] = false;
        renderQuestion();
        updateProgress();
      }
    }
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) checkCurrent();
  });
})();

</script>
</body>
</html>
