<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NCS 고등학교 CBT · 50문항 (약점 집중)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet" />
  <style>
:root {
  --ink: #14201c;
  --muted: #4a5c55;
  --paper: #f3f7f4;
  --panel: rgba(255, 255, 255, 0.86);
  --line: rgba(20, 32, 28, 0.12);
  --accent: #0f6b4c;
  --accent-2: #c45c26;
  --good: #1b7a4a;
  --bad: #b42318;
  --warn: #9a6700;
  --shadow: 0 18px 50px rgba(15, 40, 30, 0.12);
  --radius: 18px;
  --font-display: "Outfit", "IBM Plex Sans KR", sans-serif;
  --font-body: "IBM Plex Sans KR", sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  font-family: var(--font-body);
  color: var(--ink);
  background: #dfeae3;
  line-height: 1.55;
}

.bg-layer {
  position: fixed;
  inset: 0;
  z-index: -1;
  background:
    radial-gradient(1000px 500px at 10% -10%, rgba(196, 92, 38, 0.18), transparent 55%),
    radial-gradient(900px 480px at 100% 0%, rgba(15, 107, 76, 0.22), transparent 50%),
    linear-gradient(160deg, #e8f1ec 0%, #f7f3ee 45%, #d9e8df 100%);
  animation: drift 18s ease-in-out infinite alternate;
}
.bg-layer::after {
  content: "";
  position: absolute;
  inset: 0;
  opacity: 0.35;
  background-image:
    linear-gradient(rgba(20, 32, 28, 0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(20, 32, 28, 0.03) 1px, transparent 1px);
  background-size: 28px 28px;
  mask-image: radial-gradient(ellipse at center, black 40%, transparent 80%);
}

@keyframes drift {
  from { transform: scale(1) translateY(0); }
  to { transform: scale(1.04) translateY(-8px); }
}

.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 1rem;
  padding: 1rem 1.25rem;
  border-bottom: 1px solid var(--line);
  backdrop-filter: blur(10px);
  background: rgba(255, 255, 255, 0.55);
  position: sticky;
  top: 0;
  z-index: 10;
}

.brand { display: flex; align-items: center; gap: 0.85rem; }
.brand-mark {
  font-family: var(--font-display);
  font-weight: 800;
  letter-spacing: 0.04em;
  background: var(--ink);
  color: #f4faf6;
  width: 3rem;
  height: 3rem;
  border-radius: 12px;
  display: grid;
  place-items: center;
  animation: popIn 0.6s ease both;
}
.brand-text { display: flex; flex-direction: column; }
.brand-text strong {
  font-family: var(--font-display);
  font-size: 1.05rem;
  letter-spacing: -0.02em;
}
.brand-text span { font-size: 0.78rem; color: var(--muted); }

.top-meta { display: flex; align-items: center; gap: 1rem; }
.timer {
  font-family: var(--font-display);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  background: #12241d;
  color: #e8fff4;
  padding: 0.45rem 0.75rem;
  border-radius: 999px;
  min-width: 4.5rem;
  text-align: center;
}
.timer.warn { background: var(--accent-2); }
.timer.danger { background: var(--bad); animation: pulse 1s ease infinite; }

@keyframes pulse {
  50% { transform: scale(1.04); }
}

.progress-wrap { min-width: 8rem; }
.progress-label { font-size: 0.75rem; color: var(--muted); margin-bottom: 0.25rem; }
.progress-track {
  height: 6px;
  background: rgba(20, 32, 28, 0.1);
  border-radius: 999px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, var(--accent), #2a9d6e);
  transition: width 0.35s ease;
}

main {
  max-width: 1100px;
  margin: 0 auto;
  padding: 1.5rem 1rem 3rem;
}

.panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 1.75rem;
  animation: rise 0.55s ease both;
}

@keyframes rise {
  from { opacity: 0; transform: translateY(14px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes popIn {
  from { opacity: 0; transform: scale(0.86); }
  to { opacity: 1; transform: scale(1); }
}

.eyebrow {
  text-transform: uppercase;
  letter-spacing: 0.14em;
  font-size: 0.72rem;
  font-weight: 600;
  color: var(--accent);
  margin: 0 0 0.6rem;
}
h1 {
  font-family: var(--font-display);
  font-weight: 800;
  letter-spacing: -0.03em;
  font-size: clamp(2rem, 5vw, 3.1rem);
  line-height: 1.15;
  margin: 0 0 0.75rem;
}
.lead { color: var(--muted); margin: 0 0 1.5rem; font-size: 1.05rem; }
.hint { color: var(--muted); font-size: 0.9rem; margin: 1rem 0 0; }

.subject-grid {
  list-style: none;
  padding: 0;
  margin: 0 0 1.5rem;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 0.75rem;
}
.subject-grid li {
  padding: 0.9rem 1rem;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: rgba(255, 255, 255, 0.7);
  display: flex;
  flex-direction: column;
  gap: 0.2rem;
  transition: transform 0.25s ease, border-color 0.25s ease;
}
.subject-grid li:hover {
  transform: translateY(-2px);
  border-color: rgba(15, 107, 76, 0.35);
}
.subject-grid b { font-size: 0.95rem; }
.subject-grid span { color: var(--muted); font-size: 0.82rem; }
.subject-grid li.hot {
  border-color: rgba(196, 92, 38, 0.45);
  background: linear-gradient(160deg, rgba(255, 244, 232, 0.95), rgba(255, 255, 255, 0.85));
}
.subject-grid li.hot b { color: var(--accent-2); }

.focus-banner {
  margin: 0 0 1.25rem;
  padding: 0.95rem 1.05rem;
  border-radius: 14px;
  border: 1px solid rgba(196, 92, 38, 0.28);
  background: rgba(255, 248, 242, 0.95);
  color: var(--muted);
  font-size: 0.92rem;
  line-height: 1.5;
}
.focus-banner strong {
  display: block;
  color: var(--accent-2);
  margin-bottom: 0.35rem;
  font-size: 0.95rem;
}
.focus-banner b { color: var(--ink); }

.weakness-box {
  margin: 0 0 1.25rem;
  padding: 1rem 1.1rem;
  border-radius: 14px;
  border: 1px solid rgba(15, 107, 76, 0.2);
  background: rgba(241, 250, 245, 0.95);
}
.weakness-box strong {
  display: block;
  margin-bottom: 0.55rem;
  color: var(--accent);
}
.weak-row {
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem 0.75rem;
  align-items: baseline;
  padding: 0.35rem 0;
  border-bottom: 1px dashed var(--line);
  font-size: 0.92rem;
}
.weak-row:last-of-type { border-bottom: none; }
.weak-row em { color: var(--muted); font-style: normal; }
.weak-tip {
  margin: 0.7rem 0 0;
  color: var(--muted);
  font-size: 0.88rem;
}
.subject-scores article.weak {
  border-color: rgba(196, 92, 38, 0.4);
  background: #fff6ef;
}

.cta-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.85rem;
}

.btn {
  font-family: var(--font-body);
  font-weight: 600;
  border: none;
  cursor: pointer;
  border-radius: 12px;
  padding: 0.75rem 1.15rem;
  font-size: 0.95rem;
  transition: transform 0.15s ease, background 0.2s ease, opacity 0.2s ease;
}
.btn:hover { transform: translateY(-1px); }
.btn:active { transform: translateY(0); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
.btn.primary { background: var(--accent); color: #fff; }
.btn.primary:hover { background: #0c5a40; }
.btn.secondary { background: #1d2f28; color: #f3fff8; }
.btn.ghost {
  background: transparent;
  border: 1px solid var(--line);
  color: var(--ink);
}
.btn.full { width: 100%; }

.check-inline {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  color: var(--muted);
  font-size: 0.9rem;
  user-select: none;
}

.quiz-layout {
  display: grid;
  grid-template-columns: 220px 1fr;
  gap: 1.25rem;
}

.nav-pane {
  border-right: 1px solid var(--line);
  padding-right: 1rem;
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}
.nav-head {
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--muted);
}
.nav-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 0.35rem;
  max-height: 420px;
  overflow: auto;
  padding-right: 0.2rem;
}
.nav-btn {
  aspect-ratio: 1;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #fff;
  font-size: 0.72rem;
  font-weight: 600;
  cursor: pointer;
  color: var(--ink);
}
.nav-btn.current {
  border-color: var(--accent);
  box-shadow: inset 0 0 0 1px var(--accent);
}
.nav-btn.answered { background: #e5f4ec; }
.nav-btn.correct { background: #d9f0e3; color: var(--good); }
.nav-btn.wrong { background: #fde8e6; color: var(--bad); }
.nav-btn.essay-done { background: #fff4e8; }

.q-meta {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  margin-bottom: 0.75rem;
}
.badge {
  display: inline-flex;
  align-items: center;
  padding: 0.25rem 0.65rem;
  border-radius: 999px;
  background: rgba(15, 107, 76, 0.12);
  color: var(--accent);
  font-size: 0.78rem;
  font-weight: 600;
}
.q-num { color: var(--muted); font-size: 0.85rem; }
.q-stem {
  font-size: 1.2rem;
  font-weight: 700;
  margin: 0 0 1rem;
  white-space: pre-wrap;
  letter-spacing: -0.01em;
}
.q-passage {
  background: rgba(20, 32, 28, 0.04);
  border-left: 3px solid var(--accent);
  padding: 0.9rem 1rem;
  margin-bottom: 1rem;
  border-radius: 0 12px 12px 0;
  color: var(--muted);
  white-space: pre-wrap;
}

.choices { display: flex; flex-direction: column; gap: 0.55rem; }
.choice {
  text-align: left;
  width: 100%;
  padding: 0.85rem 1rem;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: #fff;
  cursor: pointer;
  font-family: var(--font-body);
  font-size: 0.95rem;
  display: flex;
  gap: 0.7rem;
  align-items: flex-start;
  transition: border-color 0.2s ease, background 0.2s ease;
}
.choice:hover { border-color: rgba(15, 107, 76, 0.4); }
.choice.selected {
  border-color: var(--accent);
  background: rgba(15, 107, 76, 0.08);
}
.choice.correct {
  border-color: var(--good);
  background: rgba(27, 122, 74, 0.12);
}
.choice.wrong {
  border-color: var(--bad);
  background: rgba(180, 35, 24, 0.08);
}
.choice-key {
  font-family: var(--font-display);
  font-weight: 700;
  color: var(--accent);
  min-width: 1.2rem;
}

.essay-box label {
  display: block;
  font-weight: 600;
  margin-bottom: 0.4rem;
  font-size: 0.9rem;
}
.essay-box textarea {
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 0.9rem 1rem;
  font-family: var(--font-body);
  font-size: 0.95rem;
  resize: vertical;
  background: #fff;
  color: var(--ink);
}
.essay-box textarea:focus {
  outline: 2px solid rgba(15, 107, 76, 0.35);
  border-color: var(--accent);
}

.feedback {
  margin-top: 1rem;
  padding: 0.95rem 1rem;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: #fff;
  animation: rise 0.35s ease both;
}
.feedback.ok { border-color: rgba(27, 122, 74, 0.35); background: #f1faf5; }
.feedback.no { border-color: rgba(180, 35, 24, 0.3); background: #fff6f5; }
.feedback.essay { border-color: rgba(196, 92, 38, 0.3); background: #fff8f2; }
.feedback strong { display: block; margin-bottom: 0.35rem; }
.feedback .model {
  margin-top: 0.65rem;
  padding-top: 0.65rem;
  border-top: 1px dashed var(--line);
  color: var(--muted);
  white-space: pre-wrap;
}

.action-row {
  display: flex;
  flex-wrap: wrap;
  gap: 0.6rem;
  margin-top: 1.25rem;
  justify-content: flex-end;
}

.score-ring-wrap { display: flex; justify-content: center; margin: 1.25rem 0 1.5rem; }
.score-ring {
  width: 160px;
  height: 160px;
  border-radius: 50%;
  display: grid;
  place-content: center;
  text-align: center;
  background:
    radial-gradient(circle at center, #fff 58%, transparent 59%),
    conic-gradient(var(--accent) var(--p, 0%), rgba(20, 32, 28, 0.1) 0);
  animation: popIn 0.6s ease both;
}
.score-ring strong {
  font-family: var(--font-display);
  font-size: 2rem;
  line-height: 1;
}
.score-ring span { color: var(--muted); font-size: 0.85rem; }

.subject-scores {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 0.7rem;
  margin-bottom: 1.5rem;
}
.subject-scores article {
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 0.8rem 0.9rem;
  background: rgba(255, 255, 255, 0.75);
}
.subject-scores h3 {
  margin: 0 0 0.25rem;
  font-size: 0.88rem;
}
.subject-scores p {
  margin: 0;
  color: var(--muted);
  font-size: 0.85rem;
}

@media (max-width: 820px) {
  .quiz-layout { grid-template-columns: 1fr; }
  .nav-pane {
    border-right: none;
    border-bottom: 1px solid var(--line);
    padding-right: 0;
    padding-bottom: 1rem;
  }
  .nav-grid {
    max-height: none;
    grid-template-columns: repeat(10, 1fr);
  }
  .subject-grid,
  .subject-scores { grid-template-columns: repeat(2, 1fr); }
  .topbar { flex-direction: column; align-items: flex-start; }
}

@media (max-width: 520px) {
  .subject-grid,
  .subject-scores { grid-template-columns: 1fr; }
  .nav-grid { grid-template-columns: repeat(5, 1fr); }
  .action-row { justify-content: stretch; }
  .action-row .btn { flex: 1; }
}

</style>
</head>
<body>
  <div class="bg-layer" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">NCS</span>
      <div class="brand-text">
        <strong>고등학교 CBT</strong>
        <span>역사·영어·논리 집중 · 전 문항 객관식</span>
      </div>
    </div>
    <div class="top-meta" id="topMeta" hidden>
      <div class="timer" id="timer" aria-live="polite">60:00</div>
      <div class="progress-wrap">
        <div class="progress-label"><span id="answeredCount">0</span> / 50</div>
        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      </div>
    </div>
  </header>

  <main>
    <section class="panel start-panel" id="startPanel">
      <p class="eyebrow">Computer Based Test · Set 2</p>
      <h1>NCS 형식<br />약점 집중 퀴즈</h1>
      <p class="lead">총 50문항 · 전부 객관식 · 즉시 채점 · 해설 제공</p>

      <div class="focus-banner" id="focusBanner"></div>

      <ul class="subject-grid" aria-label="과목 구성">
        <li class="hot"><b>역사상식</b><span>12문항 · 집중</span></li>
        <li class="hot"><b>영어</b><span>10문항 · 집중</span></li>
        <li class="hot"><b>논리</b><span>10문항 · 집중</span></li>
        <li><b>일반상식</b><span>8문항</span></li>
        <li><b>수리·물리</b><span>6문항</span></li>
        <li><b>의사소통</b><span>4문항 · 구 논술</span></li>
      </ul>

      <div class="cta-row">
        <button type="button" class="btn primary" id="startBtn">시험 시작</button>
        <label class="check-inline">
          <input type="checkbox" id="timerToggle" checked />
          60분 타이머
        </label>
      </div>
      <p class="hint">선택 후 <b>정답 확인</b>으로 바로 채점하세요. 제출 시 과목별 약점이 이 기기에 저장됩니다.</p>
    </section>

    <section class="panel quiz-panel" id="quizPanel" hidden>
      <div class="quiz-layout">
        <aside class="nav-pane" aria-label="문항 번호">
          <div class="nav-head">문항</div>
          <div class="nav-grid" id="navGrid"></div>
          <button type="button" class="btn ghost full" id="submitAllBtn">전체 제출 · 결과</button>
        </aside>

        <div class="question-pane">
          <div class="q-meta">
            <span class="badge" id="qSubject"></span>
            <span class="q-num" id="qNum"></span>
          </div>
          <h2 class="q-stem" id="qStem"></h2>
          <div class="q-passage" id="qPassage" hidden></div>
          <div class="choices" id="choices"></div>
          <div class="feedback" id="feedback" hidden></div>
          <div class="action-row">
            <button type="button" class="btn ghost" id="prevBtn">이전</button>
            <button type="button" class="btn secondary" id="checkBtn">정답 확인</button>
            <button type="button" class="btn primary" id="nextBtn">다음</button>
          </div>
        </div>
      </div>
    </section>

    <section class="panel result-panel" id="resultPanel" hidden>
      <p class="eyebrow">결과</p>
      <h1 id="scoreTitle">채점 완료</h1>
      <p class="lead" id="scoreLead"></p>
      <div class="score-ring-wrap">
        <div class="score-ring" id="scoreRing">
          <strong id="scorePct">0%</strong>
          <span id="scoreFrac">0 / 50</span>
        </div>
      </div>
      <div class="weakness-box" id="weaknessBox"></div>
      <div class="subject-scores" id="subjectScores"></div>
      <div class="cta-row">
        <button type="button" class="btn primary" id="reviewBtn">오답·해설 다시보기</button>
        <button type="button" class="btn ghost" id="restartBtn">다시 풀기</button>
      </div>
    </section>
  </main>

  <script>
/* NCS High School CBT v2 — 50 MC only, weakness-weighted
   Focus: 역사상식(12) · 영어(10) · 논리(10) · 일반상식(8) · 수리·물리(6) · 의사소통(4)
   Rationale: 데이터/개발 지향 학습자 기준, 인문·언어·논리 비중 강화 */
window.NCS_META = {
  version: 2,
  focus: ["역사상식", "영어", "논리"],
  focusNote:
    "저장된 응시 기록이 없어, 데이터·개발 학습 프로필을 기준으로 역사·영어·논리를 집중 보강했습니다. 이번 응시 후 약점이 자동 저장됩니다."
};

window.NCS_QUESTIONS = [
  // ===== 역사상식 1–12 =====
  {
    id: 1,
    subject: "역사상식",
    type: "mc",
    stem: "조선을 건국한 인물과 건국 연도로 바르게 짝지은 것은?",
    choices: ["왕건 – 918년", "이성계 – 1392년", "궁예 – 901년", "대조영 – 698년", "세종 – 1418년"],
    answer: 1,
    explain: "이성계가 1392년 조선을 건국했다. 왕건은 고려, 대조영은 발해."
  },
  {
    id: 2,
    subject: "역사상식",
    type: "mc",
    stem: "통일신라의 전성기를 이끈 왕으로 알려진 인물은?",
    choices: ["진흥왕", "무열왕", "문무왕", "신문왕", "경덕왕"],
    answer: 2,
    explain: "문무왕은 삼국 통일을 완성하고 당군을 몰아내 통일신라의 기반을 다졌다. (전성기 관련으로 흔히 거론)"
  },
  {
    id: 3,

    answer: 1,
    explain: "지구는 서에서 동으로 자전하며 낮과 밤이 생긴다. 계절은 공전·자전축 기울기."
  },

  // ===== 수리·물리 41–46 =====
  {
    id: 41,
    subject: "수리·물리",
    type: "mc",
    stem: "이차방정식 x² − 7x + 10 = 0의 두 근의 곱은?",
    choices: ["−10", "−7", "7", "10", "17"],
    answer: 3,
    explain: "근과 계수: 곱 = c/a = 10. (근은 2, 5)"
  },
  {
    id: 42,
    subject: "수리·물리",
    type: "mc",
    stem: "등차수열 5, 9, 13, 17, … 의 제10항은?",
    choices: ["37", "41", "45", "49", "53"],
    answer: 1,
    explain: "aₙ = 5 + (n−1)·4 → a₁₀ = 5+36 = 41."
  },
  {
    id: 43,
    subject: "수리·물리",
    type: "mc",
    stem: "질량 2 kg인 물체에 10 N의 힘을 가할 때 가속도는? (마찰 무시)",
    choices: ["2 m/s²", "5 m/s²", "8 m/s²", "10 m/s²", "20 m/s²"],
    answer: 1,
    explain: "a = F/m = 10/2 = 5 m/s²."
  },
  {
    id: 44,
    subject: "수리·물리",
    type: "mc",
    stem: "저항 4 Ω에 전류 3 A가 흐를 때 양단 전압은?",
    choices: ["0.75 V", "1.33 V", "7 V", "12 V", "16 V"],
    answer: 3,
    explain: "V = IR = 3×4 = 12 V."
  },
  {
    id: 45,
    subject: "수리·물리",
    type: "mc",
    stem: "log₁₀ 1000의 값은?",
    choices: ["1", "2", "3", "4", "10"],
    answer: 2,
    explain: "10³ = 1000이므로 log₁₀ 1000 = 3."
  },
  {
    id: 46,
    subject: "수리·물리",
    type: "mc",
    stem: "일정한 속력 15 m/s로 40초 동안 움직인 이동 거리는?",
    choices: ["55 m", "200 m", "400 m", "600 m", "800 m"],
    answer: 3,
    explain: "거리 = 15×40 = 600 m."
  },

  // ===== 의사소통(구 논술) 47–50 — all MC =====
  {
    id: 47,
    subject: "의사소통",
    type: "mc",
    stem: "다음 중 주장과 근거가 가장 잘 연결된 문장은?",
    choices: [
      "운동은 좋다. 왜냐하면 내가 운동을 좋아하기 때문이다.",
      "독서를 늘려야 한다. 어휘력과 집중력이 향상된다는 연구 결과가 있기 때문이다.",
      "교칙은 필요 없다. 친구가 그렇게 말했기 때문이다.",
      "시험은 없어져야 한다. 그냥 싫기 때문이다.",
      "환경 문제는 중요하지 않다. 관심이 없기 때문이다."
    ],
    answer: 1,
    explain: "객관적·일반화 가능한 근거(연구)로 주장을 뒷받침한다."
  },
  {
    id: 48,
    subject: "의사소통",
    type: "mc",
    stem: "보고서의 ‘서론’에 들어가기에 가장 적절한 내용은?",
    choices: [
      "실험 데이터의 표만 나열한다",
      "연구 목적과 문제 제기",
      "참고문헌 목록만 적는다",
      "결론을 먼저 확정 선언한다",
      "부록의 원자료만 붙인다"
    ],
    answer: 1,
    explain: "서론은 주제 배경, 문제 제기, 목적 등을 제시하는 부분이다."
  },
  {
    id: 49,
    subject: "의사소통",
    type: "mc",
    stem: "다음 중 비난·인신공격에 해당하여 토론에서 피해야 할 발언은?",
    choices: [
      "그 정책은 비용 대비 효과가 낮아 보입니다. 근거는 다음과 같습니다.",
      "상대 주장의 통계 출처가 불분명합니다.",
      "너는 원래 공부를 못하니 의견도 틀렸다.",
      "대안으로는 A안과 B안을 비교할 수 있습니다.",
      "전제의 정의를 먼저 합의합시다."
    ],
    answer: 2,
    explain: "사람 자체를 공격하는 인신공격은 합리적 토론을 방해한다."
  },
  {
    id: 50,
    subject: "의사소통",
    type: "mc",
    stem: "안내문의 문장 중 가장 명확하고 정중한 표현은?",
    choices: [
      "당장 안 오면 알아서 해.",
      "내일까지 안 내면 큰일 남.",
      "제출 기한은 금요일 17시입니다. 기한 내 제출 부탁드립니다.",
      "알아서 빨리빨리!!",
      "왜 아직도 안 냄?"
    ],
    answer: 2,
    explain: "기한·요청이 구체적이고 정중한 문장이다."
  }
];

(() => {
  const Q = window.NCS_QUESTIONS;
  const META = window.NCS_META || {};
  const KEYS = ["①", "②", "③", "④", "⑤"];
  const TOTAL = Q.length;
  const STORAGE_KEY = "ncs-cbt-history-v2";

  const state = {
    index: 0,
    answers: Array(TOTAL).fill(null),
    checked: Array(TOTAL).fill(false),
    results: Array(TOTAL).fill(null),
    timerOn: true,
    seconds: 60 * 60,
    timerId: null,
    started: false,
    finished: false
  };

  const $ = (id) => document.getElementById(id);
  const startPanel = $("startPanel");
  const quizPanel = $("quizPanel");
  const resultPanel = $("resultPanel");
  const topMeta = $("topMeta");

  function loadHistory() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
    } catch {
      return [];
    }
  }

  function saveAttempt(payload) {
    const hist = loadHistory();
    hist.unshift(payload);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(hist.slice(0, 10)));
  }

  function lastWeakSubjects() {
    const hist = loadHistory();
    if (!hist.length) return META.focus || [];
    const last = hist[0];
    return (last.subjects || [])
      .filter((s) => s.total > 0 && s.correct / s.total < 0.6)
      .sort((a, b) => a.correct / a.total - b.correct / b.total)
      .map((s) => s.name)
      .slice(0, 3);
  }

  function renderFocusBanner() {
    const box = $("focusBanner");
    const weak = lastWeakSubjects();
    const fromHistory = loadHistory().length > 0;
    const labels = weak.length ? weak.join(" · ") : (META.focus || []).join(" · ");
    box.innerHTML = fromHistory
      ? `<strong>지난 응시 약점 반영</strong><span>정답률 낮은 과목: <b>${labels}</b> — 이번 세트는 해당 영역을 더 많이 포함합니다.</span>`
      : `<strong>약점 집중 세트</strong><span>${META.focusNote || ""}</span><br/><span>집중 과목: <b>${labels}</b></span>`;
  }

  function answeredCount() {
    return state.answers.filter((a) => a !== null).length;
  }

  function updateProgress() {
    const n = answeredCount();
    $("answeredCount").textContent = String(n);
    $("progressFill").style.width = `${(n / TOTAL) * 100}%`;
  }

  function formatTime(sec) {
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
  }

  function tickTimer() {
    const el = $("timer");
    el.textContent = formatTime(state.seconds);
    el.classList.toggle("warn", state.seconds <= 300 && state.seconds > 60);
    el.classList.toggle("danger", state.seconds <= 60);
    if (state.seconds <= 0) {
      clearInterval(state.timerId);
      finishTest(true);
      return;
    }
    state.seconds -= 1;
  }

  function buildNav() {
    const grid = $("navGrid");
    grid.innerHTML = "";
    Q.forEach((q, i) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "nav-btn";
      btn.textContent = String(i + 1);
      btn.title = q.subject;
      btn.addEventListener("click", () => {
        state.index = i;
        renderQuestion();
      });
      grid.appendChild(btn);
    });
  }

  function refreshNav() {
    const buttons = $("navGrid").children;
    [...buttons].forEach((btn, i) => {
      btn.classList.remove("current", "answered", "correct", "wrong");
      if (i === state.index) btn.classList.add("current");
      if (state.answers[i] !== null) btn.classList.add("answered");
      if (state.checked[i]) {
        if (state.results[i] === true) btn.classList.add("correct");
        else if (state.results[i] === false) btn.classList.add("wrong");
      }
    });
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

  function showFeedback(title, kind, explain) {
    const box = $("feedback");
    box.hidden = false;
    box.className = `feedback ${kind}`;
    box.innerHTML = `<strong>${title}</strong>${explain ? `<div>${explain}</div>` : ""}`;
  }

  function checkCurrent() {
    const i = state.index;
    const q = Q[i];
    if (state.answers[i] === null) {
      showFeedback("답을 선택한 뒤 확인하세요.", "no");
      return;
    }
    const correct = state.answers[i] === q.answer;
    state.checked[i] = true;
    state.results[i] = correct;
    renderQuestion();
    showFeedback(
      correct ? "정답입니다." : `오답입니다. 정답은 ${KEYS[q.answer]}입니다.`,
      correct ? "ok" : "no",
      q.explain
    );
    updateProgress();
    refreshNav();
  }

  function renderQuestion() {
    const i = state.index;
    const q = Q[i];
    $("qSubject").textContent = q.subject;
    $("qNum").textContent = `${i + 1} / ${TOTAL}`;
    $("qStem").textContent = q.stem;

    const passage = $("qPassage");
    if (q.passage) {
      passage.hidden = false;
      passage.textContent = q.passage;
    } else {
      passage.hidden = true;
      passage.textContent = "";
    }

    const choices = $("choices");
    const feedback = $("feedback");
    feedback.hidden = true;
    feedback.innerHTML = "";
    choices.innerHTML = "";

    q.choices.forEach((c, ci) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "choice";
      if (state.answers[i] === ci) btn.classList.add("selected");
      if (state.checked[i]) {
        if (ci === q.answer) btn.classList.add("correct");
        else if (state.answers[i] === ci) btn.classList.add("wrong");
      }
      btn.innerHTML = `<span class="choice-key">${KEYS[ci]}</span><span>${escapeHtml(c)}</span>`;
      btn.addEventListener("click", () => {
        if (state.finished) return;
        state.answers[i] = ci;
        state.checked[i] = false;
        state.results[i] = null;
        renderQuestion();
        updateProgress();
        refreshNav();
      });
      choices.appendChild(btn);
    });

    if (state.checked[i]) {
      const correct = state.results[i] === true;
      showFeedback(
        correct ? "정답입니다." : `오답입니다. 정답은 ${KEYS[q.answer]}입니다.`,
        correct ? "ok" : "no",
        q.explain
      );
    }

    $("prevBtn").disabled = i === 0;
    $("nextBtn").textContent = i === TOTAL - 1 ? "결과 보기" : "다음";
    refreshNav();
  }

  function startTest() {
    state.started = true;
    state.finished = false;
    state.index = 0;
    state.answers = Array(TOTAL).fill(null);
    state.checked = Array(TOTAL).fill(false);
    state.results = Array(TOTAL).fill(null);
    state.timerOn = $("timerToggle").checked;
    state.seconds = 60 * 60;

    startPanel.hidden = true;
    resultPanel.hidden = true;
    quizPanel.hidden = false;
    topMeta.hidden = false;

    buildNav();
    renderQuestion();
    updateProgress();

    if (state.timerId) clearInterval(state.timerId);
    if (state.timerOn) {
      $("timer").hidden = false;
      tickTimer();
      state.timerId = setInterval(tickTimer, 1000);
    } else {
      $("timer").hidden = true;
    }
  }

  function computeScores() {
    const bySubject = {};
    let correct = 0;

    Q.forEach((q, i) => {
      if (!bySubject[q.subject]) bySubject[q.subject] = { name: q.subject, correct: 0, total: 0 };
      bySubject[q.subject].total += 1;
      const ok = state.answers[i] === q.answer;
      state.results[i] = ok;
      state.checked[i] = true;
      if (ok) {
        correct += 1;
        bySubject[q.subject].correct += 1;
      }
    });

    const subjects = Object.values(bySubject);
    return { correct, subjects };
  }

  function finishTest(fromTimer) {
    if (state.timerId) clearInterval(state.timerId);
    state.finished = true;

    const scores = computeScores();
    const pct = Math.round((scores.correct / TOTAL) * 100);
    const weak = scores.subjects
      .filter((s) => s.total > 0)
      .map((s) => ({ ...s, rate: s.correct / s.total }))
      .sort((a, b) => a.rate - b.rate);

    saveAttempt({
      at: Date.now(),
      version: META.version || 2,
      correct: scores.correct,
      total: TOTAL,
      subjects: scores.subjects
    });

    quizPanel.hidden = true;
    resultPanel.hidden = false;
    $("scoreTitle").textContent = fromTimer ? "시간 종료 · 자동 제출" : "채점 완료";
    $("scoreLead").textContent = `전체 정답 ${scores.correct}/${TOTAL}`;
    $("scorePct").textContent = `${pct}%`;
    $("scoreFrac").textContent = `${scores.correct} / ${TOTAL}`;
    $("scoreRing").style.setProperty("--p", `${pct}%`);

    const wbox = $("weaknessBox");
    const topWeak = weak.filter((s) => s.rate < 0.7).slice(0, 3);
    if (topWeak.length) {
      wbox.innerHTML =
        `<strong>약점 분석</strong>` +
        topWeak
          .map(
            (s) =>
              `<div class="weak-row"><span>${s.name}</span><b>${s.correct}/${s.total}</b> <em>(${Math.round(s.rate * 100)}%)</em></div>`
          )
          .join("") +
        `<p class="weak-tip">다음 세트에서는 위 과목 비중을 더 늘리는 것을 권장합니다. 결과는 이 기기에 저장되었습니다.</p>`;
    } else {
      wbox.innerHTML = `<strong>약점 분석</strong><p class="weak-tip">전 과목 정답률이 고르게 양호합니다. 오답 해설을 복습해 보세요.</p>`;
    }

    const box = $("subjectScores");
    box.innerHTML = "";
    scores.subjects.forEach((s) => {
      const rate = Math.round((s.correct / s.total) * 100);
      const art = document.createElement("article");
      if (rate < 60) art.classList.add("weak");
      art.innerHTML = `<h3>${s.name}</h3><p>${s.correct} / ${s.total} · ${rate}%</p>`;
      box.appendChild(art);
    });
  }

  $("startBtn").addEventListener("click", startTest);
  $("checkBtn").addEventListener("click", checkCurrent);
  $("prevBtn").addEventListener("click", () => {
    if (state.index > 0) {
      state.index -= 1;
      renderQuestion();
    }
  });
  $("nextBtn").addEventListener("click", () => {
    if (state.index < TOTAL - 1) {
      state.index += 1;
      renderQuestion();
    } else {
      finishTest(false);
    }
  });
  $("submitAllBtn").addEventListener("click", () => {
    if (confirm("전체 제출하고 결과를 확인할까요?")) finishTest(false);
  });
  $("reviewBtn").addEventListener("click", () => {
    resultPanel.hidden = true;
    quizPanel.hidden = false;
    state.index = 0;
    renderQuestion();
  });
  $("restartBtn").addEventListener("click", () => {
    startPanel.hidden = false;
    resultPanel.hidden = true;
    quizPanel.hidden = true;
    topMeta.hidden = true;
    if (state.timerId) clearInterval(state.timerId);
    renderFocusBanner();
  });

  document.addEventListener("keydown", (e) => {
    if (!state.started || state.finished || quizPanel.hidden) return;
    if (e.target && (e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT")) return;
    const q = Q[state.index];
    if (e.key >= "1" && e.key <= "5") {
      const ci = Number(e.key) - 1;
      if (ci < q.choices.length) {
        state.answers[state.index] = ci;
        state.checked[state.index] = false;
        renderQuestion();
        updateProgress();
      }
    }
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) checkCurrent();
  });

  renderFocusBanner();
})();

</script>
</body>
</html>
