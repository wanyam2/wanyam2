<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>한국사 인물 암기 카드</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Outfit:wght@600;800&display=swap" rel="stylesheet" />
  <style>
:root {
  --ink: #14201c;
  --muted: #4a5c55;
  --paper: #f3f7f4;
  --panel: rgba(255, 255, 255, 0.86);
  --line: rgba(20, 32, 28, 0.12);
  --accent: #0f6b4c;
  --accent-2: #c45c26;
  --good: #1b7a4a;
  --bad: #b42318;
  --warn: #9a6700;
  --shadow: 0 18px 50px rgba(15, 40, 30, 0.12);
  --radius: 18px;
  --font-display: "Outfit", "IBM Plex Sans KR", sans-serif;
  --font-body: "IBM Plex Sans KR", sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  font-family: var(--font-body);
  color: var(--ink);
  background: #dfeae3;
  line-height: 1.55;
}

.bg-layer {
  position: fixed;
  inset: 0;
  z-index: -1;
  background:
    radial-gradient(1000px 500px at 10% -10%, rgba(196, 92, 38, 0.18), transparent 55%),
    radial-gradient(900px 480px at 100% 0%, rgba(15, 107, 76, 0.22), transparent 50%),
    linear-gradient(160deg, #e8f1ec 0%, #f7f3ee 45%, #d9e8df 100%);
  animation: drift 18s ease-in-out infinite alternate;
}
.bg-layer::after {
  content: "";
  position: absolute;
  inset: 0;
  opacity: 0.35;
  background-image:
    linear-gradient(rgba(20, 32, 28, 0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(20, 32, 28, 0.03) 1px, transparent 1px);
  background-size: 28px 28px;
  mask-image: radial-gradient(ellipse at center, black 40%, transparent 80%);
}

@keyframes drift {
  from { transform: scale(1) translateY(0); }
  to { transform: scale(1.04) translateY(-8px); }
}

.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 1rem;
  padding: 1rem 1.25rem;
  border-bottom: 1px solid var(--line);
  backdrop-filter: blur(10px);
  background: rgba(255, 255, 255, 0.55);
  position: sticky;
  top: 0;
  z-index: 10;
}

.brand { display: flex; align-items: center; gap: 0.85rem; }
.brand-mark {
  font-family: var(--font-display);
  font-weight: 800;
  letter-spacing: 0.04em;
  background: var(--ink);
  color: #f4faf6;
  width: 3rem;
  height: 3rem;
  border-radius: 12px;
  display: grid;
  place-items: center;
  animation: popIn 0.6s ease both;
}
.brand-text { display: flex; flex-direction: column; }
.brand-text strong {
  font-family: var(--font-display);
  font-size: 1.05rem;
  letter-spacing: -0.02em;
}
.brand-text span { font-size: 0.78rem; color: var(--muted); }

.top-meta { display: flex; align-items: center; gap: 1rem; }
.timer {
  font-family: var(--font-display);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  background: #12241d;
  color: #e8fff4;
  padding: 0.45rem 0.75rem;
  border-radius: 999px;
  min-width: 4.5rem;
  text-align: center;
}
.timer.warn { background: var(--accent-2); }
.timer.danger { background: var(--bad); animation: pulse 1s ease infinite; }

@keyframes pulse {
  50% { transform: scale(1.04); }
}

.progress-wrap { min-width: 8rem; }
.progress-label { font-size: 0.75rem; color: var(--muted); margin-bottom: 0.25rem; }
.progress-track {
  height: 6px;
  background: rgba(20, 32, 28, 0.1);
  border-radius: 999px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, var(--accent), #2a9d6e);
  transition: width 0.35s ease;
}

main {
  max-width: 1100px;
  margin: 0 auto;
  padding: 1.5rem 1rem 3rem;
}

.panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 1.75rem;
  animation: rise 0.55s ease both;
}

@keyframes rise {
  from { opacity: 0; transform: translateY(14px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes popIn {
  from { opacity: 0; transform: scale(0.86); }
  to { opacity: 1; transform: scale(1); }
}

.eyebrow {
  text-transform: uppercase;
  letter-spacing: 0.14em;
  font-size: 0.72rem;
  font-weight: 600;
  color: var(--accent);
  margin: 0 0 0.6rem;
}
h1 {
  font-family: var(--font-display);
  font-weight: 800;
  letter-spacing: -0.03em;
  font-size: clamp(2rem, 5vw, 3.1rem);
  line-height: 1.15;
  margin: 0 0 0.75rem;
}
.lead { color: var(--muted); margin: 0 0 1.5rem; font-size: 1.05rem; }
.hint { color: var(--muted); font-size: 0.9rem; margin: 1rem 0 0; }

.subject-grid {
  list-style: none;
  padding: 0;
  margin: 0 0 1.5rem;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 0.75rem;
}
.subject-grid li {
  padding: 0.9rem 1rem;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: rgba(255, 255, 255, 0.7);
  display: flex;
  flex-direction: column;
  gap: 0.2rem;
  transition: transform 0.25s ease, border-color 0.25s ease;
}
.subject-grid li:hover {
  transform: translateY(-2px);
  border-color: rgba(15, 107, 76, 0.35);
}
.subject-grid b { font-size: 0.95rem; }
.subject-grid span { color: var(--muted); font-size: 0.82rem; }
.subject-grid li.hot {
  border-color: rgba(196, 92, 38, 0.45);
  background: linear-gradient(160deg, rgba(255, 244, 232, 0.95), rgba(255, 255, 255, 0.85));
}
.subject-grid li.hot b { color: var(--accent-2); }

.focus-banner {
  margin: 0 0 1.25rem;
  padding: 0.95rem 1.05rem;
  border-radius: 14px;
  border: 1px solid rgba(196, 92, 38, 0.28);
  background: rgba(255, 248, 242, 0.95);
  color: var(--muted);
  font-size: 0.92rem;
  line-height: 1.5;
}
.focus-banner strong {
  display: block;
  color: var(--accent-2);
  margin-bottom: 0.35rem;
  font-size: 0.95rem;
}
.focus-banner b { color: var(--ink); }

.weakness-box {
  margin: 0 0 1.25rem;
  padding: 1rem 1.1rem;
  border-radius: 14px;
  border: 1px solid rgba(15, 107, 76, 0.2);
  background: rgba(241, 250, 245, 0.95);
}
.weakness-box strong {
  display: block;
  margin-bottom: 0.55rem;
  color: var(--accent);
}
.weak-row {
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem 0.75rem;
  align-items: baseline;
  padding: 0.35rem 0;
  border-bottom: 1px dashed var(--line);
  font-size: 0.92rem;
}
.weak-row:last-of-type { border-bottom: none; }
.weak-row em { color: var(--muted); font-style: normal; }
.weak-tip {
  margin: 0.7rem 0 0;
  color: var(--muted);
  font-size: 0.88rem;
}
.subject-scores article.weak {
  border-color: rgba(196, 92, 38, 0.4);
  background: #fff6ef;
}

.cta-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.85rem;
}

.btn {
  font-family: var(--font-body);
  font-weight: 600;
  border: none;
  cursor: pointer;
  border-radius: 12px;
  padding: 0.75rem 1.15rem;
  font-size: 0.95rem;
  transition: transform 0.15s ease, background 0.2s ease, opacity 0.2s ease;
}
.btn:hover { transform: translateY(-1px); }
.btn:active { transform: translateY(0); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
.btn.primary { background: var(--accent); color: #fff; }
.btn.primary:hover { background: #0c5a40; }
.btn.secondary { background: #1d2f28; color: #f3fff8; }
.btn.ghost {
  background: transparent;
  border: 1px solid var(--line);
  color: var(--ink);
}
.btn.full { width: 100%; }
a.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
}

.era-label {
  margin: 0 0 0.55rem;
  font-weight: 700;
  font-size: 0.95rem;
}
.era-buttons {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 0.55rem;
}
.era-btn {
  border: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.85);
  border-radius: 14px;
  padding: 0.75rem 0.6rem;
  cursor: pointer;
  font-family: var(--font-body);
  display: flex;
  flex-direction: column;
  gap: 0.2rem;
  text-align: left;
  transition: border-color 0.2s ease, transform 0.15s ease, background 0.2s ease;
}
.era-btn b { font-size: 0.9rem; color: var(--ink); }
.era-btn span { font-size: 0.78rem; color: var(--muted); }
.era-btn:hover { transform: translateY(-1px); border-color: rgba(15, 107, 76, 0.35); }
.era-btn.active {
  border-color: var(--accent-2);
  background: linear-gradient(160deg, rgba(255, 244, 232, 0.95), #fff);
  box-shadow: inset 0 0 0 1px rgba(196, 92, 38, 0.25);
}
.era-btn.active b { color: var(--accent-2); }

@media (max-width: 820px) {
  .era-buttons { grid-template-columns: repeat(2, 1fr); }
}

.check-inline {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  color: var(--muted);
  font-size: 0.9rem;
  user-select: none;
}

.quiz-layout {
  display: grid;
  grid-template-columns: 220px 1fr;
  gap: 1.25rem;
}

.nav-pane {
  border-right: 1px solid var(--line);
  padding-right: 1rem;
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}
.nav-head {
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--muted);
}
.nav-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 0.35rem;
  max-height: 420px;
  overflow: auto;
  padding-right: 0.2rem;
}
.nav-btn {
  aspect-ratio: 1;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #fff;
  font-size: 0.72rem;
  font-weight: 600;
  cursor: pointer;
  color: var(--ink);
}
.nav-btn.current {
  border-color: var(--accent);
  box-shadow: inset 0 0 0 1px var(--accent);
}
.nav-btn.answered { background: #e5f4ec; }
.nav-btn.correct { background: #d9f0e3; color: var(--good); }
.nav-btn.wrong { background: #fde8e6; color: var(--bad); }
.nav-btn.essay-done { background: #fff4e8; }

.q-meta {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  margin-bottom: 0.75rem;
}
.badge {
  display: inline-flex;
  align-items: center;
  padding: 0.25rem 0.65rem;
  border-radius: 999px;
  background: rgba(15, 107, 76, 0.12);
  color: var(--accent);
  font-size: 0.78rem;
  font-weight: 600;
}
.badge.format {
  background: rgba(196, 92, 38, 0.12);
  color: var(--accent-2);
}
.q-num { color: var(--muted); font-size: 0.85rem; }
.q-stem {
  font-size: 1.2rem;
  font-weight: 700;
  margin: 0 0 1rem;
  white-space: pre-wrap;
  letter-spacing: -0.01em;
}
.q-passage {
  background: rgba(20, 32, 28, 0.04);
  border-left: 3px solid var(--accent);
  padding: 0.9rem 1rem;
  margin-bottom: 1rem;
  border-radius: 0 12px 12px 0;
  color: var(--muted);
  white-space: pre-wrap;
}

.choices { display: flex; flex-direction: column; gap: 0.55rem; }
.choice {
  text-align: left;
  width: 100%;
  padding: 0.85rem 1rem;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: #fff;
  cursor: pointer;
  font-family: var(--font-body);
  font-size: 0.95rem;
  display: flex;
  gap: 0.7rem;
  align-items: flex-start;
  transition: border-color 0.2s ease, background 0.2s ease;
}
.choice:hover { border-color: rgba(15, 107, 76, 0.4); }
.choice.selected {
  border-color: var(--accent);
  background: rgba(15, 107, 76, 0.08);
}
.choice.correct {
  border-color: var(--good);
  background: rgba(27, 122, 74, 0.12);
}
.choice.wrong {
  border-color: var(--bad);
  background: rgba(180, 35, 24, 0.08);
}
.choice-key {
  font-family: var(--font-display);
  font-weight: 700;
  color: var(--accent);
  min-width: 1.2rem;
}

.essay-box label {
  display: block;
  font-weight: 600;
  margin-bottom: 0.4rem;
  font-size: 0.9rem;
}
.essay-box textarea {
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 0.9rem 1rem;
  font-family: var(--font-body);
  font-size: 0.95rem;
  resize: vertical;
  background: #fff;
  color: var(--ink);
}
.essay-box textarea:focus {
  outline: 2px solid rgba(15, 107, 76, 0.35);
  border-color: var(--accent);
}

.feedback {
  margin-top: 1rem;
  padding: 0.95rem 1rem;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: #fff;
  animation: rise 0.35s ease both;
}
.feedback.ok { border-color: rgba(27, 122, 74, 0.35); background: #f1faf5; }
.feedback.no { border-color: rgba(180, 35, 24, 0.3); background: #fff6f5; }
.feedback.essay { border-color: rgba(196, 92, 38, 0.3); background: #fff8f2; }
.feedback strong { display: block; margin-bottom: 0.35rem; }
.feedback .model {
  margin-top: 0.65rem;
  padding-top: 0.65rem;
  border-top: 1px dashed var(--line);
  color: var(--muted);
  white-space: pre-wrap;
}

.action-row {
  display: flex;
  flex-wrap: wrap;
  gap: 0.6rem;
  margin-top: 1.25rem;
  justify-content: flex-end;
}

.score-ring-wrap { display: flex; justify-content: center; margin: 1.25rem 0 1.5rem; }
.score-ring {
  width: 160px;
  height: 160px;
  border-radius: 50%;
  display: grid;
  place-content: center;
  text-align: center;
  background:
    radial-gradient(circle at center, #fff 58%, transparent 59%),
    conic-gradient(var(--accent) var(--p, 0%), rgba(20, 32, 28, 0.1) 0);
  animation: popIn 0.6s ease both;
}
.score-ring strong {
  font-family: var(--font-display);
  font-size: 2rem;
  line-height: 1;
}
.score-ring span { color: var(--muted); font-size: 0.85rem; }

.subject-scores {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 0.7rem;
  margin-bottom: 1.5rem;
}
.subject-scores article {
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 0.8rem 0.9rem;
  background: rgba(255, 255, 255, 0.75);
}
.subject-scores h3 {
  margin: 0 0 0.25rem;
  font-size: 0.88rem;
}
.subject-scores p {
  margin: 0;
  color: var(--muted);
  font-size: 0.85rem;
}

@media (max-width: 820px) {
  .quiz-layout { grid-template-columns: 1fr; }
  .nav-pane {
    border-right: none;
    border-bottom: 1px solid var(--line);
    padding-right: 0;
    padding-bottom: 1rem;
  }
  .nav-grid {
    max-height: none;
    grid-template-columns: repeat(10, 1fr);
  }
  .subject-grid,
  .subject-scores { grid-template-columns: repeat(2, 1fr); }
  .topbar { flex-direction: column; align-items: flex-start; }
}

@media (max-width: 520px) {
  .subject-grid,
  .subject-scores { grid-template-columns: 1fr; }
  .nav-grid { grid-template-columns: repeat(5, 1fr); }
  .action-row { justify-content: stretch; }
  .action-row .btn { flex: 1; }
}

.study-main {
  max-width: 900px;
  margin: 0 auto;
  padding: 1.25rem 1rem 3rem;
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

.study-main h2 {
  font-family: var(--font-display);
  margin: 0 0 0.4rem;
  font-size: 1.45rem;
  letter-spacing: -0.02em;
}

.section-lead {
  color: var(--muted);
  margin: 0 0 1rem;
  font-size: 0.95rem;
}

.study-toc {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
  margin-top: 1rem;
}
.study-toc a {
  text-decoration: none;
  color: var(--accent);
  border: 1px solid rgba(15, 107, 76, 0.25);
  background: rgba(15, 107, 76, 0.06);
  padding: 0.4rem 0.75rem;
  border-radius: 999px;
  font-size: 0.85rem;
  font-weight: 600;
}

.timeline {
  display: grid;
  gap: 0.45rem;
}
.timeline article {
  display: grid;
  grid-template-columns: 7.5rem 1fr;
  gap: 0.75rem;
  padding: 0.7rem 0.85rem;
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.75);
  border: 1px solid var(--line);
  align-items: center;
}
.timeline.compact article { grid-template-columns: 6.5rem 1fr; }
.timeline b {
  font-family: var(--font-display);
  color: var(--accent);
  font-size: 0.95rem;
}
.timeline span { color: var(--ink); font-size: 0.92rem; }

.cards {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 0.65rem;
}
.flip-card {
  border: 1px solid var(--line);
  border-radius: 14px;
  background: #fff;
  padding: 1rem;
  min-height: 110px;
  cursor: pointer;
  text-align: left;
  font-family: var(--font-body);
  transition: transform 0.2s ease, border-color 0.2s ease;
}
.flip-card:hover { transform: translateY(-2px); border-color: rgba(15, 107, 76, 0.35); }
.flip-card .q {
  font-weight: 700;
  margin-bottom: 0.45rem;
}
.flip-card .a {
  color: var(--accent);
  font-weight: 600;
  display: none;
}
.flip-card.open .a { display: block; }
.flip-card.open .hint-tap { display: none; }
.hint-tap {
  color: var(--muted);
  font-size: 0.8rem;
}

.kv-table {
  display: grid;
  gap: 0.5rem;
}
.kv-row {
  display: grid;
  grid-template-columns: 8.5rem 1fr;
  gap: 0.75rem;
  padding: 0.75rem 0.85rem;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.8);
}
.kv-row b { color: var(--accent-2); font-size: 0.92rem; }
.kv-row span { font-size: 0.92rem; color: var(--ink); }

.tips {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 0.7rem;
}
.tips article {
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 0.9rem 1rem;
  background: linear-gradient(160deg, rgba(255, 244, 232, 0.9), rgba(255, 255, 255, 0.85));
}
.tips h3 {
  margin: 0 0 0.4rem;
  font-size: 0.98rem;
  color: var(--accent-2);
}
.tips p {
  margin: 0;
  font-size: 0.9rem;
  color: var(--muted);
  line-height: 1.5;
}
.tips b { color: var(--ink); }

.bullet-list {
  margin: 1rem 0 0;
  padding-left: 1.2rem;
  color: var(--muted);
}
.bullet-list li { margin: 0.35rem 0; }
.bullet-list b { color: var(--ink); }

.drill-box { display: grid; gap: 0.75rem; }
.drill-item label {
  display: block;
  font-weight: 600;
  margin-bottom: 0.35rem;
  font-size: 0.92rem;
}
.drill-item input {
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 0.7rem 0.85rem;
  font-family: var(--font-body);
  font-size: 0.95rem;
}
.drill-item.ok input { border-color: var(--good); background: #f1faf5; }
.drill-item.no input { border-color: var(--bad); background: #fff6f5; }

.match-box { display: grid; gap: 0.9rem; }
.match-item {
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 0.85rem 1rem;
  background: rgba(255, 255, 255, 0.85);
}
.match-q {
  font-weight: 700;
  margin-bottom: 0.55rem;
  font-size: 0.95rem;
}
.match-choices {
  display: flex;
  flex-wrap: wrap;
  gap: 0.45rem;
}
.match-choices button {
  border: 1px solid var(--line);
  background: #fff;
  border-radius: 10px;
  padding: 0.45rem 0.75rem;
  font-family: var(--font-body);
  font-size: 0.88rem;
  cursor: pointer;
}
.match-choices button.ok {
  border-color: var(--good);
  background: #eaf7f0;
  color: var(--good);
  font-weight: 700;
}
.match-choices button.no {
  border-color: var(--bad);
  background: #fff1f0;
  color: var(--bad);
}
.subject-scores article.hot-score,
.hot-score {
  border-color: rgba(196, 92, 38, 0.4) !important;
  background: #fff6ef !important;
}

a.btn {
  display: inline-flex;
  align-items: center;
  text-decoration: none;
}

@media (max-width: 700px) {
  .cards, .tips { grid-template-columns: 1fr; }
  .timeline article, .kv-row {
    grid-template-columns: 1fr;
    gap: 0.25rem;
  }
}

</style>
</head>
<body>
  <div class="bg-layer" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">史</span>
      <div class="brand-text">
        <strong>인물 암기 카드</strong>
        <span>업적 중심 · 연도 최소화</span>
      </div>
    </div>
    <div class="top-meta" style="display:flex;gap:.6rem;flex-wrap:wrap">
      <a class="btn ghost" href="quiz.html">CBT 풀기</a>
      <a class="btn primary" href="index.html">홈</a>
    </div>
  </header>

  <main class="study-main">
    <section class="panel">
      <p class="eyebrow">People First</p>
      <h1>누가, 무엇을 했는가</h1>
      <p class="lead">카드를 탭하면 업적이 나옵니다. 연도보다 역할·성과를 먼저 잡으세요.</p>
      <nav class="study-toc">
        <a href="#ancient">고대·남북국</a>
        <a href="#goryeo">고려</a>
        <a href="#joseon">조선</a>
        <a href="#modern">근현대</a>
        <a href="#match">짝맞추기</a>
      </nav>
    </section>

    <section class="panel" id="ancient">
      <h2>고대 · 남북국</h2>
      <div class="cards" data-pack="ancient"></div>
    </section>
    <section class="panel" id="goryeo">
      <h2>고려</h2>
      <div class="cards" data-pack="goryeo"></div>
    </section>
    <section class="panel" id="joseon">
      <h2>조선</h2>
      <div class="cards" data-pack="joseon"></div>
    </section>
    <section class="panel" id="modern">
      <h2>근현대 · 독립운동</h2>
      <div class="cards" data-pack="modern"></div>
    </section>

    <section class="panel" id="match">
      <h2>빠른 짝맞추기</h2>
      <p class="section-lead">업적을 보고 인물을 고르세요. (즉시 채점)</p>
      <div id="matchBox" class="match-box"></div>
      <div class="cta-row" style="margin-top:1rem">
        <button type="button" class="btn primary" id="reshuffleMatch">다시 섞기</button>
        <a class="btn secondary" href="quiz.html">인물 CBT 풀기</a>
      </div>
      <p class="hint" id="matchScore"></p>
    </section>
  </main>

  <script>
(() => {
  const packs = {
    ancient: [
      { q: "근초고왕", a: "백제 전성기·마한 통합" },
      { q: "성왕", a: "사비 천도·백제 중흥" },
      { q: "진흥왕", a: "신라 영토 확장·화랑도 정비" },
      { q: "김춘추", a: "나당 연합·무열왕" },
      { q: "문무왕", a: "당군 격퇴·통일 완성" },
      { q: "을지문덕", a: "살수대첩" },
      { q: "양만춘", a: "안시성 방어" },
      { q: "의상", a: "화엄종·부석사" },
      { q: "견훤", a: "후백제 건국" },
      { q: "궁예", a: "후고구려·태봉" },
      { q: "주몽", a: "고구려 건국" },
      { q: "장보고", a: "청해진·해상 세력" }
    ],
    goryeo: [
      { q: "서희", a: "강동 6주 확보 외교" },
      { q: "강감찬", a: "귀주대첩" },
      { q: "윤관", a: "별무반·여진 정벌" },
      { q: "최충헌", a: "최씨 무신정권 기반" },
      { q: "최우", a: "강화 천도·대몽 항전" },
      { q: "공민왕", a: "반원·개혁 정치" },
      { q: "신돈", a: "공민왕 개혁 보좌" },
      { q: "의천", a: "천태종 정비" },
      { q: "지눌", a: "수선사 결사·정혜쌍수" },
      { q: "김부식", a: "묘청의 난 진압·삼국사기" },
      { q: "왕건", a: "고려 건국" },
      { q: "광종", a: "과거제·왕권 강화" }
    ],
    joseon: [
      { q: "태종", a: "사병 혁파·왕권 강화" },
      { q: "세종", a: "훈민정음·민본·과학" },
      { q: "중종", a: "조광조 등용(기묘사화)" },
      { q: "조광조", a: "도학 정치·현량과" },
      { q: "신립", a: "탄금대 전투" },
      { q: "김시민", a: "진주대첩" },
      { q: "효종", a: "북벌론" },
      { q: "유형원", a: "『반계수록』" },
      { q: "박제가", a: "『북학의』" },
      { q: "김정희", a: "추사체·금석학" },
      { q: "이순신", a: "수군·한산도 대첩" },
      { q: "정약용", a: "『목민심서』" }
    ],
    modern: [
      { q: "흥선대원군", a: "통상 수교 거부·서원 철폐" },
      { q: "박규수", a: "개화 사상 영향" },
      { q: "최익현", a: "위정척사·의병" },
      { q: "유길준", a: "『서유견문』" },
      { q: "서재필", a: "독립협회·만민공동회" },
      { q: "이준", a: "헤이그 특사" },
      { q: "김원봉", a: "의열단" },
      { q: "이봉창", a: "도쿄 의거" },
      { q: "김구", a: "임시정부·광복군" },
      { q: "여운형", a: "건준·좌우합작" },
      { q: "안중근", a: "이토 히로부미 저격" },
      { q: "윤봉길", a: "홍커우 공원 의거" }
    ]
  };

  function mountCards() {
    document.querySelectorAll(".cards[data-pack]").forEach((el) => {
      const list = packs[el.dataset.pack] || [];
      el.innerHTML = "";
      list.forEach((p) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "flip-card";
        btn.innerHTML = `<div class="q">${p.q}</div><div class="hint-tap">탭 → 업적</div><div class="a">${p.a}</div>`;
        btn.addEventListener("click", () => btn.classList.toggle("open"));
        el.appendChild(btn);
      });
    });
  }

  const bank = Object.values(packs).flat();
  const matchBox = document.getElementById("matchBox");
  const scoreEl = document.getElementById("matchScore");

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function renderMatch() {
    matchBox.innerHTML = "";
    scoreEl.textContent = "";
    const items = shuffle(bank).slice(0, 8);
    items.forEach((item, idx) => {
      const options = shuffle(
        [item.q, ...shuffle(bank.filter((b) => b.q !== item.q)).slice(0, 3).map((b) => b.q)]
      );
      const wrap = document.createElement("div");
      wrap.className = "match-item";
      wrap.innerHTML = `<div class="match-q">${idx + 1}. ${item.a}</div>`;
      const row = document.createElement("div");
      row.className = "match-choices";
      options.forEach((name) => {
        const b = document.createElement("button");
        b.type = "button";
        b.textContent = name;
        b.addEventListener("click", () => {
          const ok = name === item.q;
          b.classList.add(ok ? "ok" : "no");
          [...row.children].forEach((c) => (c.disabled = true));
          if (!ok) {
            [...row.children].find((c) => c.textContent === item.q)?.classList.add("ok");
          }
          updateMatchScore();
        });
        row.appendChild(b);
      });
      wrap.appendChild(row);
      matchBox.appendChild(wrap);
    });
  }

  function updateMatchScore() {
    const groups = matchBox.querySelectorAll(".match-item").length;
    const answered = [...matchBox.querySelectorAll(".match-choices")].filter((r) =>
      [...r.children].some((c) => c.disabled)
    ).length;
    let correct = 0;
    matchBox.querySelectorAll(".match-item").forEach((item) => {
      const no = item.querySelector("button.no");
      const okBtn = item.querySelector("button.ok");
      if (okBtn && !no) correct += 1;
    });
    if (answered) scoreEl.textContent = `현재 ${correct} / ${answered} (전체 ${groups}문항)`;
  }

  document.getElementById("reshuffleMatch").addEventListener("click", renderMatch);
  mountCards();
  renderMatch();
})();

</script>
</body>
</html>
